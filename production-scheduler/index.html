/* ============================== ENGINE ============================== */
function orderCode(name){
  const w=String(name||'').trim().split(/\s+/);
  return (w.length>1?w.map(x=>x[0]).join(''):String(name||'X').slice(0,2)).toUpperCase().slice(0,3);
}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtMD(d){return (d.getMonth()+1)+'/'+d.getDate();}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}

// Work calendar in "effective minutes": each working day contributes
// hoursPerDay*60 * utilization * ptoFactor productive minutes per tech.
function buildCalendar(a){
  const start=parseISO(a.horizonStart);
  const hol=new Set(a.holidays);
  const horizonDays=a.weeks*7;
  const leadDays=Math.max(0,Math.round(a.leadWeeks||0))*7;   // WIP head start before week 1
  const calStart=addDays(start,-leadDays);
  const days=[];                      // working days, extended 3x horizon so late schedules resolve
  for(let i=0;i<leadDays+horizonDays*3;i++){
    const d=addDays(calStart,i);
    const dow=d.getDay();
    if(dow===0||dow===6) continue;
    if(hol.has(fmtISO(d))) continue;
    days.push(d);
  }
  // attended hours/day incl. standing OT; Saturday hours are spread across the 5 weekdays
  // (an approximation that keeps the calendar uniform — capacity is exact, day-of-week isn't)
  const hpd=a.hoursPerDay+(a.otHoursPerDay||0)+(a.satHoursPerWeek||0)/5;
  const workdaysInHorizon=days.filter(d=>d>=start&&(d-start)/864e5<horizonDays).length;
  const workdayHours=workdaysInHorizon*hpd;
  const ptoFactor=Math.max(0.01,1-(a.ptoDays*hpd)/Math.max(1,workdayHours));
  const dayEff=hpd*60*a.utilization*ptoFactor;             // effective minutes per tech-day
  const weeks=[];
  for(let w=0;w<a.weeks;w++){
    const ws=addDays(start,w*7);
    weeks.push({idx:w,start:ws,end:addDays(ws,6),label:fmtMD(ws),
      workdays:days.filter(d=>d>=ws&&d<addDays(ws,7)).length});
  }
  function effToDate(eff){            // effective-minute offset -> real Date
    let di=Math.floor(eff/dayEff);
    if(di>=days.length)di=days.length-1;
    return days[di];
  }
  function dateToWeek(d){
    const w=Math.floor((d-start)/(7*864e5));
    return w;                          // may exceed weeks-1 (overflow past horizon)
  }
  function weekStartEff(w){            // effective minutes elapsed before week w begins
    const ws=addDays(start,w*7);
    return days.filter(d=>d<ws).length*dayEff;
  }
  function weekEndEff(w){
    const we=addDays(start,w*7+7);
    return days.filter(d=>d<we).length*dayEff;
  }
  const leadWorkdays=days.filter(d=>d<start).length;
  function dateToEff(d){return days.filter(x=>x<d).length*dayEff;}
  return {start,days,dayEff,hpd,ptoFactor,weeks,workdaysInHorizon,leadWorkdays,effToDate,dateToWeek,weekStartEff,weekEndEff,dateToEff,
    horizonEndEff:weekEndEff(a.weeks-1)};
}

// Expand state into a task list for the finite-capacity scheduler.
function buildTasks(st,cal){
  const a=st.assumptions;
  const tasks=[];
  const mainOps=st.operations.filter(o=>o.type==='M').slice().sort((x,y)=>x.seq-y.seq);
  const benchOps=st.operations.filter(o=>o.type==='B');
  const depsByAfter=new Map();
  (st.dependencies||[]).forEach(d=>{
    if(!depsByAfter.has(d.after))depsByAfter.set(d.after,[]);
    depsByAfter.get(d.after).push(d.before);
  });
  let unitNo=0;
  const eff=Math.max(0.05,a.efficiency);
  // One SlipLift = all bench ops (parallel) + main ops (per mainMode). scale<1 models
  // work already completed (order % complete); dueDateISO overrides the week-end due date.
  function makeUnit(unit,dueEff,dueWeek,scale,order,dueDateISO){
    unitNo++;
    const benchIds=[];
    benchOps.forEach(o=>{
      const id=unit+':'+o.id;
      benchIds.push(id);
      tasks.push({id,unit,unitNo,dueWeek,order,dueDateISO,label:o.name,cat:'bench',
        dur:o.minTotal/eff*scale,release:0,due:dueEff,preds:[],needsBench:true});
    });
    const mainIdByName=new Map(mainOps.map(o=>[o.name,unit+':'+o.id]));
    let prev=null;
    mainOps.forEach(o=>{
      const id=unit+':'+o.id;
      let preds;
      if((a.mainMode||'serial')==='dag'){
        // precedence graph from the MBOM dependencies sheet; ops without main-line
        // predecessors gate on bench completion (subassembly availability)
        preds=(depsByAfter.get(o.name)||[]).map(n=>mainIdByName.get(n)).filter(Boolean);
        if(!preds.length&&a.requireBenchBeforeMain)preds=benchIds.slice();
      }else{
        preds=prev?[prev]:(a.requireBenchBeforeMain?benchIds.slice():[]);
      }
      tasks.push({id,unit,unitNo,dueWeek,order,dueDateISO,label:o.name,cat:'main',
        dur:o.minTotal/eff*scale,release:0,due:dueEff,preds,needsStation:true});
      prev=id;
    });
  }
  // Customer orders: hard due dates (handoff), progress-adjusted remaining work
  (st.orders||[]).forEach(o=>{
    if(!o.handoff)return;
    const hd=parseISO(o.handoff);
    const dueEff=cal.dateToEff(addDays(hd,1));   // end of the handoff day
    const w=Math.max(0,Math.min(a.weeks-1,Math.floor((hd-cal.start)/(7*864e5))));
    const code=orderCode(o.name);
    const slScale=Math.max(0,1-(o.doneSL||0));
    if(slScale>0.001)for(let k=1;k<=(o.slipLifts||0);k++)
      makeUnit(code+'-L'+k,dueEff,w,slScale,o.name,o.handoff);
    const htLeft=Math.max(0,Math.round((o.heavyTrays||0)*(1-(o.doneHT||0))));
    for(let t=1;t<=htLeft;t++)
      tasks.push({id:code+'-HT'+t,unit:null,dueWeek:w,order:o.name,label:'Heavy tray — '+o.name,
        cat:'tray',dur:a.trayHours*60,release:0,due:dueEff,preds:[]});
    const binsLeft=Math.max(0,Math.round((o.bins||0)*(1-(o.doneBins||0))));
    for(let b=1;b<=binsLeft;b++)
      tasks.push({id:code+'-BIN'+b,unit:null,dueWeek:w,order:o.name,label:'Bin — '+o.name,
        cat:'tray',dur:(a.binHours||40)*60,release:0,due:dueEff,preds:[]});
  });
  // Build-to-stock plan: due at the end of the plan week
  st.buildPlan.forEach((wk,w)=>{
    for(let k=0;k<(wk.slipLifts||0);k++)
      makeUnit('SL-'+String(unitNo+1).padStart(2,'0'),cal.weekEndEff(w),w,1,null,null);
    const trays=(wk.heavyTrays||0)+(wk.lightTrays||0);
    for(let t=0;t<trays;t++){
      tasks.push({id:'TR-w'+(w+1)+'-'+(t+1),unit:null,dueWeek:w,label:'Tray build (wk of '+cal.weeks[w].label+')',
        cat:'tray',dur:a.trayHours*60,release:0,due:cal.weekEndEff(w),preds:[]});
    }
  });
  st.recurring.forEach((r,ri)=>{
    if(!(r.hrsPerWeek>0))return;
    cal.weeks.forEach((wk,w)=>{
      if(wk.workdays===0)return;
      tasks.push({id:'RC-'+ri+'-w'+(w+1),unit:null,dueWeek:w,label:r.name,cat:'support',
        dur:r.hrsPerWeek*60,release:cal.weekStartEff(w),due:cal.weekEndEff(w),preds:[]});
    });
  });
  st.chunks.forEach((c,ci)=>{
    if(!(c.hours>0))return;
    const w1=Math.max(1,c.startWeek||1)-1, w2=Math.min(st.assumptions.weeks,c.endWeek||st.assumptions.weeks)-1;
    const slices=Math.max(1,Math.ceil(c.hours/20));
    const per=c.hours/slices;
    for(let s=0;s<slices;s++){
      tasks.push({id:'CH-'+ci+'-'+(s+1),unit:null,dueWeek:w2,label:c.name,cat:'support',
        dur:per*60,release:cal.weekStartEff(w1),due:cal.weekEndEff(w2),preds:[]});
    }
  });
  return tasks;
}

// A technician's role limits which task categories they can take.
function roleEligible(role,cat){
  if(!role||role==='any')return true;
  if(role==='robot')return cat==='bench'||cat==='main';   // SlipLift line: subassembly + install
  if(role==='bench')return cat==='bench'||cat==='tray';
  if(role==='line')return cat==='main';
  if(role==='tray')return cat==='tray'||cat==='support';  // Heavy tray line + special projects
  if(role==='support')return cat==='support'||cat==='tray';
  return true;
}
// Priority-list scheduler: earliest-due-date, main-line first on ties.
// Resources: named technicians (role-aware), main-line stations, bench seats.
// All durations in effective minutes. Each started task records its technician.
function runSchedule(st){
  const a=st.assumptions;
  const roster=(Array.isArray(st.technicians)&&st.technicians.length)?st.technicians
    :Array.from({length:a.techs||10},(_,i)=>({name:'Tech '+(i+1),role:'any'}));
  const nTech=roster.length;
  const cal=buildCalendar(a);
  const tasks=buildTasks(st,cal);
  const byId=new Map(tasks.map(t=>[t.id,t]));
  const remainingPreds=new Map(tasks.map(t=>[t.id,t.preds.length]));
  const succ=new Map();
  tasks.forEach(t=>t.preds.forEach(p=>{
    if(!succ.has(p))succ.set(p,[]);
    succ.get(p).push(t.id);
  }));
  const prio=t=>[t.due,t.needsStation?0:1,t.unitNo||1e9,t.id];
  const cmp=(x,y)=>{const px=prio(x),py=prio(y);
    for(let i=0;i<px.length;i++){if(px[i]<py[i])return -1;if(px[i]>py[i])return 1;}return 0;};
  let ready=tasks.filter(t=>t.preds.length===0&&t.release<=0).sort(cmp);
  let notReleased=tasks.filter(t=>t.preds.length===0&&t.release>0).sort((x,y)=>x.release-y.release);
  const running=[];                    // tasks in progress
  let freeTechs=[...Array(nTech).keys()];  // FIFO queue -> round-robin load spread
  let freeStation=Math.max(1,a.stations), freeBench=Math.max(1,a.benchSeats);
  // A robot occupies one station from its first main op to its last; in dag mode up to
  // maxCrewPerRobot techs may work the same robot concurrently (serial chaining caps it at 1).
  const maxCrew=(a.mainMode==='dag')?Math.max(1,Math.round(a.maxCrewPerRobot||1)):1;
  const unitMain={};
  tasks.forEach(x=>{
    if(x.cat!=='main')return;
    (unitMain[x.unit]=unitMain[x.unit]||{total:0,done:0,running:0,has:false}).total++;
  });
  let t=0, done=0;
  const HARD_STOP=cal.days.length*cal.dayEff;
  while(done<tasks.length){
    // release newly available tasks
    while(notReleased.length&&notReleased[0].release<=t){
      const nt=notReleased.shift();
      ready.splice(sortedPos(ready,nt,cmp),0,nt);
    }
    // start everything startable at time t
    let started=true;
    while(started&&freeTechs.length>0){
      started=false;
      for(let i=0;i<ready.length;i++){
        const task=ready[i];
        const um=task.needsStation?unitMain[task.unit]:null;
        if(um){
          if(!um.has&&freeStation<1)continue;
          if(um.running>=maxCrew)continue;
        }
        if(task.needsBench&&freeBench<1)continue;
        let qi=-1;
        for(let q=0;q<freeTechs.length;q++){
          if(roleEligible(roster[freeTechs[q]].role,task.cat)){qi=q;break;}
        }
        if(qi<0)continue;              // no eligible technician free
        task.tech=freeTechs.splice(qi,1)[0];
        ready.splice(i,1);
        if(um){if(!um.has){um.has=true;freeStation--;}um.running++;}
        if(task.needsBench)freeBench--;
        task.start=t; task.end=t+task.dur;
        running.push(task);
        started=true;
        break;
      }
      if(freeTechs.length===0)break;
    }
    if(running.length===0){
      if(notReleased.length){t=notReleased[0].release;continue;}
      break;                           // deadlock guard (shouldn't happen)
    }
    // advance to earliest completion
    let minEnd=Infinity;
    running.forEach(r=>{if(r.end<minEnd)minEnd=r.end;});
    const nextRelease=notReleased.length?notReleased[0].release:Infinity;
    t=Math.min(minEnd,nextRelease>t?nextRelease:Infinity);
    if(t===Infinity||t>HARD_STOP)break;
    for(let i=running.length-1;i>=0;i--){
      const r=running[i];
      if(r.end<=t){
        running.splice(i,1);
        freeTechs.push(r.tech);
        if(r.needsStation){
          const um=unitMain[r.unit];
          um.running--; um.done++;
          if(um.done>=um.total){um.has=false;freeStation++;}
        }
        if(r.needsBench)freeBench++;
        done++;
        (succ.get(r.id)||[]).forEach(sid=>{
          const n=remainingPreds.get(sid)-1;
          remainingPreds.set(sid,n);
          if(n===0){
            const s=byId.get(sid);
            if(s.release<=t)ready.splice(sortedPos(ready,s,cmp),0,s);
            else notReleased.splice(sortedPosBy(notReleased,s,x=>x.release),0,s);
          }
        });
      }
    }
  }
  // ---- results ----
  const units=[];
  const unitMap=new Map();
  tasks.filter(x=>x.unit).forEach(x=>{
    if(!unitMap.has(x.unit))unitMap.set(x.unit,{unit:x.unit,unitNo:x.unitNo,dueWeek:x.dueWeek,
      order:x.order||null,dueDateISO:x.dueDateISO||null,due:x.due,
      benchStart:Infinity,benchEnd:0,mainStart:Infinity,finish:0,scheduled:false});
    const u=unitMap.get(x.unit);
    if(x.start==null)return;
    u.scheduled=true;
    if(x.cat==='bench'){u.benchStart=Math.min(u.benchStart,x.start);u.benchEnd=Math.max(u.benchEnd,x.end);}
    else{u.mainStart=Math.min(u.mainStart,x.start);u.finish=Math.max(u.finish,x.end);}
  });
  unitMap.forEach(u=>{
    u.late=u.finish>u.due+1e-6;
    u.finishDate=u.finish?cal.effToDate(u.finish-1e-6):null;
    u.dueDate=u.dueDateISO?parseISO(u.dueDateISO):addDays(cal.weeks[u.dueWeek].start,4); // handoff or Friday of plan week
    u.benchStartDate=isFinite(u.benchStart)?cal.effToDate(u.benchStart):null;
    u.mainStartDate=isFinite(u.mainStart)?cal.effToDate(u.mainStart):null;
    u.lateDays=u.late&&u.finishDate?Math.max(1,Math.round((u.finishDate-u.dueDate)/864e5)):0;
    units.push(u);
  });
  units.sort((x,y)=>x.unitNo-y.unitNo);
  // weekly scheduled hours by category (split tasks across weeks by effective time)
  const nW=a.weeks+8;
  const weekly={build:new Array(nW).fill(0),tray:new Array(nW).fill(0),support:new Array(nW).fill(0)};
  const weekEffBounds=[];for(let w=0;w<=nW;w++)weekEffBounds.push(cal.weekEndEff(w-1));
  function addSpan(arr,s,e){
    for(let w=0;w<nW;w++){
      const ws=weekEffBounds[w],we=weekEffBounds[w+1];
      const ov=Math.min(e,we)-Math.max(s,ws);
      if(ov>0)arr[w]+=ov/60;
      if(we>=e)break;
    }
  }
  // per-technician week x category hours
  const techWeekly=Array.from({length:nTech},()=>Array.from({length:nW},()=>({main:0,bench:0,tray:0,support:0})));
  function addSpanTech(ti,cat,s,e){
    if(ti==null)return;
    for(let w=0;w<nW;w++){
      const ws=weekEffBounds[w],we=weekEffBounds[w+1];
      const ov=Math.min(e,we)-Math.max(s,ws);
      if(ov>0)techWeekly[ti][w][cat]+=ov/60;
      if(we>=e)break;
    }
  }
  tasks.forEach(x=>{
    if(x.start==null)return;
    const arr=x.cat==='tray'?weekly.tray:(x.cat==='support'?weekly.support:weekly.build);
    addSpan(arr,x.start,x.end);
    addSpanTech(x.tech,x.cat,x.start,x.end);
  });
  // capacity per week (effective hours)
  const capacity=cal.weeks.map(w=>nTech*w.workdays*cal.hpd*a.utilization*cal.ptoFactor);
  for(let w=a.weeks;w<nW;w++)capacity.push(nTech*5*cal.hpd*a.utilization*cal.ptoFactor);
  // tops-down totals
  const perUnitMin=st.operations.reduce((s,o)=>s+(o.minTotal||0),0);
  const perUnitHrs=perUnitMin/60/Math.max(0.05,a.efficiency);
  const totTrays=tasks.filter(x=>x.cat==='tray').length;
  const demandHrs=tasks.reduce((s,x)=>s+x.dur,0)/60;   // everything the scheduler must place
  const effHoursPerHead=cal.workdaysInHorizon*cal.hpd*cal.ptoFactor*a.utilization;
  const capacityHrs=effHoursPerHead*nTech;
  const headsRaw=demandHrs/Math.max(1,effHoursPerHead);
  const totUnits=units.length;
  const unitsPerWk=new Array(a.weeks).fill(0);
  units.forEach(u=>{if(u.dueWeek>=0&&u.dueWeek<a.weeks)unitsPerWk[u.dueWeek]++;});
  const sensitivity=[0.75,0.80,0.85,0.90].map(u=>{
    const effH=cal.workdaysInHorizon*cal.hpd*cal.ptoFactor*u;
    return {util:u,heads:Math.ceil(demandHrs/effH)};
  });
  const lastUnit=units.filter(u=>u.finishDate).reduce((m,u)=>!m||u.finishDate>m.finishDate?u:m,null);
  // main-line throughput: station-time per robot vs station-weeks available.
  // Serial mode: a robot holds its station for the sum of main-op minutes. DAG mode: the hold
  // is bounded below by the dependency critical path and by total work / crew size.
  const effF=Math.max(0.05,a.efficiency);
  const mains=st.operations.filter(o=>o.type==='M');
  const mainEffMin=mains.reduce((s,o)=>s+o.minTotal,0)/effF;
  let robotSpanMin=mainEffMin;
  if(a.mainMode==='dag'){
    const dur=new Map(mains.map(o=>[o.name,o.minTotal/effF]));
    const predsOf=new Map();
    (st.dependencies||[]).forEach(d=>{
      if(!dur.has(d.after)||!dur.has(d.before))return;
      if(!predsOf.has(d.after))predsOf.set(d.after,[]);
      predsOf.get(d.after).push(d.before);
    });
    const memo=new Map(),stack=new Set();let cyclic=false;
    const longest=n=>{
      if(memo.has(n))return memo.get(n);
      if(stack.has(n)){cyclic=true;return 0;}
      stack.add(n);
      const p=(predsOf.get(n)||[]).reduce((m,q)=>Math.max(m,longest(q)),0);
      stack.delete(n);
      const v=p+dur.get(n);memo.set(n,v);return v;
    };
    let crit=0;mains.forEach(o=>{crit=Math.max(crit,longest(o.name));});
    robotSpanMin=cyclic?mainEffMin:Math.max(crit,mainEffMin/Math.max(1,Math.round(a.maxCrewPerRobot||1)));
  }
  const stationWkEff=5*cal.dayEff;                            // eff minutes per station-week
  const lineRate=robotSpanMin>0?a.stations*stationWkEff/robotSpanMin:Infinity; // robots/week max
  const benchEffMin=st.operations.filter(o=>o.type==='B').reduce((s,o)=>s+o.minTotal,0)/Math.max(0.05,a.efficiency);
  const benchRate=benchEffMin>0?a.benchSeats*stationWkEff/benchEffMin:Infinity;
  const peakRate=Math.max(0,...unitsPerWk);
  const busyMin=tasks.reduce((s,x)=>x.start!=null?s+x.dur:s,0);
  const techMinAvail=(cal.workdaysInHorizon+cal.leadWorkdays)*cal.dayEff;
  const horizonTechMin=nTech*techMinAvail;
  const techTotals=roster.map((tech,ti)=>{
    const busy=tasks.reduce((s,x)=>x.tech===ti&&x.start!=null?s+x.dur:s,0);
    return {name:tech.name,role:tech.role,hours:busy/60,util:Math.min(1,busy/Math.max(1,techMinAvail))};
  });
  const unscheduled=tasks.filter(x=>x.start==null).length;
  return {cal,tasks,units,weekly,capacity,techWeekly,techTotals,roster,
    kpi:{perUnitHrs,totUnits,totTrays,demandHrs,capacityHrs,effHoursPerHead,headsRaw,
      headsRounded:Math.ceil(headsRaw),sensitivity,lastUnit,lineRate,benchRate,peakRate,
      nTech,unscheduled,techHrsAvail:techMinAvail/60,robotSpanHrs:robotSpanMin/60,
      lateUnits:units.filter(u=>u.late).length,
      onTime:units.filter(u=>!u.late&&u.scheduled).length,
      utilizationOfPool:Math.min(1,busyMin/Math.max(1,horizonTechMin))}};
}
function sortedPos(arr,item,cmp){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(cmp(arr[m],item)<=0)lo=m+1;else hi=m;}return lo;}
function sortedPosBy(arr,item,key){let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(key(arr[m])<=key(item))lo=m+1;else hi=m;}return lo;}

/* ============================== STATE ============================== */
const LS_KEY='slip-production-scheduler-v1';
let state=loadState();
let result=null;
let activeTab='dashboard';
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){
      const s=JSON.parse(raw);
      if(s&&s.version===1){
        s.assumptions=Object.assign(seedState().assumptions,s.assumptions);
        if(!Array.isArray(s.technicians)||!s.technicians.length)
          s.technicians=Array.from({length:s.assumptions.techs||10},(_,i)=>({name:'Tech '+(i+1),role:'any'}));
        if(!Array.isArray(s.dependencies))
          s.dependencies=SEED_DEPS.map(d=>({before:d[0],after:d[1]}));
        if(!Array.isArray(s.orders))s.orders=[];   // no orders injected into an edited plan — Reset to get the seed set
        if(!s.scenario)s.scenario={addRobot:0,addTray:0,addAny:0,ot:null,sat:null,stations:null,bench:null,crew:null,util:null};
        return s;
      }
    }
  }catch(e){}
  return seedState();
}
function saveState(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}}
function recompute(){result=runSchedule(state);}
function commit(){saveState();recompute();scenResult=null;scenHires=null;render();}

const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hrs(x,d=0){return x.toLocaleString(undefined,{maximumFractionDigits:d,minimumFractionDigits:0});}
const tooltip=$('#tooltip')?null:null; // placeholder; bound after DOM below
function showTip(evt,html){
  const el=$('#tooltip');
  el.innerHTML=html;el.style.display='block';
  const pad=14;let x=evt.clientX+pad,y=evt.clientY+pad;

}

// Weekly load vs capacity: stacked columns (3 series) + capacity step line.
function chartLoad(res,st){
  const a=st.assumptions;
  const nW=a.weeks;
  const W=Math.max(720,nW*46),H=300,mL=52,mR=12,mT=18,mB=40;
  const iw=W-mL-mR,ih=H-mT-mB;
  const totals=[];let maxV=0;
  for(let w=0;w<nW;w++){
    const t=res.weekly.build[w]+res.weekly.tray[w]+res.weekly.support[w];
    totals.push(t);maxV=Math.max(maxV,t,res.capacity[w]);
  }
  maxV=Math.ceil(maxV/50)*50||50;
  const x=w=>mL+iw*(w+0.5)/nW, bw=Math.min(26,iw/nW*0.62);
  const y=v=>mT+ih*(1-v/maxV);
  let g='';
  // gridlines + y labels
  for(let v=0;v<=maxV;v+=maxV/5){
    g+=`<line x1="${mL}" y1="${y(v)}" x2="${W-mR}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    g+=`<text x="${mL-7}" y="${y(v)+4}" text-anchor="end">${hrs(v)}</text>`;
  }
  // bars: stacked with 2px surface gaps
  const cats=[['build','var(--s1)','SlipLift builds'],['tray','var(--s2)','Trays'],['support','var(--s3)','Support load']];
  for(let w=0;w<nW;w++){
    let acc=0;
    cats.forEach(([k,c])=>{
      const v=res.weekly[k][w];if(v<=0.01){return;}
      const y1=y(acc+v),y2=y(acc);
      const hpx=Math.max(1.5,y2-y1);
      g+=`<rect data-w="${w}" x="${x(w)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,hpx-2)}" fill="${c}" rx="2"/>`;
      acc+=v;
    });
    // overload marker
    if(totals[w]>res.capacity[w]+0.5){
      g+=`<text x="${x(w)}" y="${y(totals[w])-6}" text-anchor="middle" font-weight="700" fill="var(--crit)">▲</text>`;
    }
    // hover target
    g+=`<rect class="hit" data-w="${w}" x="${x(w)-iw/nW/2}" y="${mT}" width="${iw/nW}" height="${ih}" fill="transparent"/>`;
    if(w%2===0||nW<=14)g+=`<text x="${x(w)}" y="${H-mB+16}" text-anchor="middle">${res.cal.weeks[w].label}</text>`;
  }
  // capacity step line
  let path='';
  for(let w=0;w<nW;w++){
    const x1=mL+iw*w/nW,x2=mL+iw*(w+1)/nW,yy=y(res.capacity[w]);
    path+=(w?`L${x1},${yy}`:`M${x1},${yy}`)+`L${x2},${yy}`;
  }
  g+=`<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>`;
  const capLblY=y(res.capacity[0]);
  g+=`<text x="${mL+4}" y="${capLblY-6}" class="lbl-strong">capacity</text>`;
  g+=`<line x1="${mL}" y1="${y(0)}" x2="${W-mR}" y2="${y(0)}" stroke="var(--axis)" stroke-width="1"/>`;
  g+=`<text x="${mL-40}" y="${mT-4}" class="lbl">hrs/wk</text>`;
  return {svg:`<svg id="chart-load" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Weekly load versus capacity">${g}</svg>`,
    bind(){
      const svg=$('#chart-load');if(!svg)return;
      svg.addEventListener('mousemove',e=>{
        const t=e.target.closest('[data-w]');if(!t){hideTip();return;}
        const w=+t.dataset.w;
        const b=res.weekly.build[w],tr=res.weekly.tray[w],sp=res.weekly.support[w],cap=res.capacity[w];
        const tot=b+tr+sp;
        const d=tot-cap;
        showTip(e,`<div class="t">Week of ${res.cal.weeks[w].label}</div>
          <div class="row"><span>SlipLift builds</span><b>${hrs(b)} h</b></div>
          <div class="row"><span>Trays &amp; bins</span><b>${hrs(tr)} h</b></div>
          <div class="row"><span>Support load</span><b>${hrs(sp)} h</b></div>
          <div class="row"><span>Total / capacity</span><b>${hrs(tot)} / ${hrs(cap)} h</b></div>
          <div class="row"><span>${d>0?'Overload':'Headroom'}</span><b>${hrs(Math.abs(d))} h</b></div>`);
      });
      svg.addEventListener('mouseleave',hideTip);
    }};
}
// Gantt: one row per SlipLift unit; bench span (aqua) + main span (blue); due tick; late ring.
function chartGantt(res,st){
  const units=res.units;
  if(!units.length)return {svg:'<p class="muted">No SlipLift units in the build plan.</p>',bind(){}};
  const lead=Math.max(0,Math.round(st.assumptions.leadWeeks||0));
  const nW=st.assumptions.weeks+4;
  const span=nW+lead;
  const rowH=18,W=Math.max(760,span*40),mL=64,mR=12,mT=26,mB=8;
  const H=mT+mB+units.length*rowH;
  const iw=W-mL-mR;
  const x=eff=>{
    // effective minutes -> week-fraction position (lead weeks shown left of horizon start)
    let w=-lead;while(w<nW&&res.cal.weekEndEff(w)<eff)w++;
    const ws=res.cal.weekStartEff(w),we=res.cal.weekEndEff(w);
    const f=we>ws?(eff-ws)/(we-ws):0;
    return mL+iw*Math.min(span,(w+lead+Math.max(0,Math.min(1,f))))/span;
  };
  let g='';
  for(let w=-lead;w<=nW;w++){
    const xx=mL+iw*(w+lead)/span;
    const isStart=w===0;
    g+=`<line x1="${xx}" y1="${mT-6}" x2="${xx}" y2="${H-mB}" stroke="${isStart?'var(--axis)':'var(--grid)'}" stroke-width="${isStart?1.6:1}"/>`;
    if(w>=0&&w<nW&&w<res.cal.weeks.length&&(w%2===0))
      g+=`<text x="${xx+2}" y="${mT-10}">${res.cal.weeks[w].label}</text>`;
  }
  if(lead>0)g+=`<text x="${mL+2}" y="${mT-10}">head start</text>`;
  // order handoff milestones
  (st.orders||[]).forEach(o=>{
    if(!o.handoff)return;
    const xe=x(res.cal.dateToEff(addDays(parseISO(o.handoff),1)));
    if(xe<=mL||xe>=mL+iw)return;
    g+=`<line x1="${xe}" y1="${mT-6}" x2="${xe}" y2="${H-mB}" stroke="var(--s2)" stroke-width="1.4" stroke-dasharray="3 3"/>`;
    g+=`<text x="${xe+3}" y="${mT+2}" fill="var(--s2)" font-weight="600">${esc(orderCode(o.name))}</text>`;
  });
  units.forEach((u,i)=>{
    const yy=mT+i*rowH;
    const yc=yy+rowH/2;
    g+=`<text x="${mL-8}" y="${yc+4}" text-anchor="end" class="lbl">${esc(u.unit)}</text>`;
    if(isFinite(u.benchStart)&&u.benchEnd>u.benchStart){
      g+=`<rect data-u="${i}" x="${x(u.benchStart)}" y="${yc-5}" width="${Math.max(2,x(u.benchEnd)-x(u.benchStart))}" height="4.5" fill="var(--s3)" rx="2"/>`;
    }
    if(isFinite(u.mainStart)&&u.finish>u.mainStart){
      g+=`<rect data-u="${i}" x="${x(u.mainStart)}" y="${yc-0.5}" width="${Math.max(2,x(u.finish)-x(u.mainStart))}" height="6.5" fill="var(--s1)" rx="2"
          ${u.late?'stroke="var(--crit)" stroke-width="1.6"':''}/>`;
    }
    const dx=x(u.due);
    g+=`<line x1="${dx}" y1="${yc-7}" x2="${dx}" y2="${yc+7}" stroke="${u.late?'var(--crit)':'var(--axis)'}" stroke-width="2"/>`;
    g+=`<rect class="hit" data-u="${i}" x="${mL}" y="${yy}" width="${iw}" height="${rowH}" fill="transparent"/>`;
  });
  return {svg:`<svg id="chart-gantt" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Per-unit schedule Gantt">${g}</svg>`,
    bind(){
      const svg=$('#chart-gantt');if(!svg)return;
      svg.addEventListener('mousemove',e=>{
        const t=e.target.closest('[data-u]');if(!t){hideTip();return;}
        const u=res.units[+t.dataset.u];
        showTip(e,`<div class="t">${esc(u.unit)} — due ${fmtMD(u.dueDate)}</div>
          <div class="row"><span>Bench starts</span><b>${u.benchStartDate?fmtMD(u.benchStartDate):'—'}</b></div>
          <div class="row"><span>Line starts</span><b>${u.mainStartDate?fmtMD(u.mainStartDate):'—'}</b></div>
          <div class="row"><span>Completes</span><b>${u.finishDate?fmtMD(u.finishDate):'—'}</b></div>
          <div class="row"><span>Status</span><b>${u.late?'LATE +'+u.lateDays+'d':'On time'}</b></div>`);
      });
      svg.addEventListener('mouseleave',hideTip);
    }};
}

const TABS=[['dashboard','Dashboard'],['schedule','Schedule'],['techs','Technicians'],['plan','Build Plan'],
  ['ops','Operations'],['scenario','Scenario'],['assumptions','Assumptions'],['help','Help']];

function render(){
  $('#tabs').innerHTML=TABS.map(([id,l])=>
    `<button data-tab="${id}" class="${id===activeTab?'active':''}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render();});
  const a=state.assumptions;
  $('#hdr-sub').textContent=`SLIP Robotics · ${a.weeks} weeks from ${fmtMD(parseISO(a.horizonStart))} · ${state.technicians.length} techs · finite-capacity schedule`;
  const v={dashboard:viewDashboard,schedule:viewSchedule,techs:viewTechs,plan:viewPlan,ops:viewOps,scenario:viewScenario,assumptions:viewAssumptions,help:viewHelp}[activeTab];
  const out=v();
  const stale=(state.seedVersion||0)<SEED_VERSION;
  const banner=stale?`<div class="alert warn" style="margin-bottom:16px">
    <span class="tag">Data update</span>
    <span>This page ships newer seed data (customer orders + Master Production Plan crew/calendar) than your saved plan.
    <button id="btn-seed-load" class="primary small" style="margin:0 6px">Load latest seed</button>
    <button id="btn-seed-keep" class="small">Keep my edits</button></span></div>`:'';
  $('#main').innerHTML=banner+out.html;
  if(stale){
    $('#btn-seed-load').onclick=()=>{state=seedState();commit();};
    $('#btn-seed-keep').onclick=()=>{state.seedVersion=SEED_VERSION;saveState();render();};
  }
  (out.bind||(()=>{}))();
}

function alertsHtml(){
  const k=result.kpi,a=state.assumptions;
  const items=[];
  if(k.demandHrs>k.capacityHrs){
    items.push(['crit','Capacity',`Demand ${hrs(k.demandHrs)} h exceeds capacity ${hrs(k.capacityHrs)} h — short ${hrs(k.demandHrs-k.capacityHrs)} h (~${(k.headsRaw-k.nTech).toFixed(1)} heads). Add techs, OT, or move demand.`]);
  }else{
    items.push(['good','Capacity',`Demand ${hrs(k.demandHrs)} h fits capacity ${hrs(k.capacityHrs)} h (headroom ${hrs(k.capacityHrs-k.demandHrs)} h).`]);
  }
  if(isFinite(k.lineRate)&&k.peakRate>0&&k.lineRate<k.peakRate-0.01){
    const modeTxt=a.mainMode==='dag'?`dependency-graph flow, crew of ${Math.max(1,Math.round(a.maxCrewPerRobot||1))}/robot`:'serial install+test';
    items.push(['crit','Line rate',`Main line maxes out at ${k.lineRate.toFixed(1)} robots/wk (${a.stations} station${a.stations>1?'s':''}, ~${k.robotSpanHrs.toFixed(1)} station-hours per robot, ${modeTxt}) but the plan peaks at ${k.peakRate}/wk. Add a station or increase crew per robot.`]);
  }
  if(isFinite(k.benchRate)&&k.peakRate>0&&k.benchRate<k.peakRate-0.01){
    items.push(['crit','Bench rate',`Bench subassembly maxes out at ${k.benchRate.toFixed(1)} robot-sets/wk (${a.benchSeats} seat${a.benchSeats>1?'s':''}) but the plan peaks at ${k.peakRate} robots/wk. Add bench seats (people working subassembly in parallel) or pre-build ahead of the ramp.`]);
  }
  if(k.lateUnits>0)items.push(['crit','Schedule',`${k.lateUnits} of ${k.totUnits} SlipLifts finish after their plan week. See Schedule tab.`]);
  else if(k.totUnits>0)items.push(['good','Schedule',`All ${k.totUnits} SlipLifts complete within their plan weeks.`]);
  if(k.unscheduled>0){
    items.push(['crit','Roster',`${k.unscheduled} tasks could not be scheduled — no technician role is eligible for them. Check roles in the Technicians tab (e.g., at least one Any/Line tech for main-line work).`]);
  }
  if(state.trayGap&&!state.trayGap.applied&&(state.trayGap.heavy+state.trayGap.light)>0){
    const g=state.trayGap;
    const parts=[];
    if(g.heavy>0)parts.push(`heavy −${g.heavy} by wk ${g.heavyByWeek}`);
    if(g.light>0)parts.push(`light −${g.light} by wk ${g.lightByWeek}`);
    items.push(['warn','Forecast gap',`Build plan is short ${g.heavy+g.light} trays vs. demand commitments (${parts.join(', ')}). Add them in the Build Plan tab.`]);
  }
  return `<div class="alerts">${items.map(([c,t,m])=>
    `<div class="alert ${c}"><span class="tag">${t}</span><span>${m}</span></div>`).join('')}</div>`;
}

    const remHrs=all.reduce((s,x)=>s+x.dur,0)/60;

  const orderCard=orderRows?`

  return {html:alertsHtml()+kpis+orderCard+`
    <div class="card">
      <h2>Weekly load vs. capacity</h2>
      <p class="sub">Effective hours (utilization ${Math.round(a.utilization*100)}%, PTO spread, holidays out). Dashed line = ${k.nTech}-tech capacity; ▲ = overloaded week.</p>
      <div class="legend">
        <span><span class="sw" style="background:var(--s1)"></span>SlipLift builds</span>
        <span><span class="sw" style="background:var(--s2)"></span>Trays &amp; bins</span>
        <span><span class="sw" style="background:var(--s3)"></span>Support load (recurring + work chunks)</span>
      </div>
      <div class="svgwrap">${load.svg}</div>
    </div>`+sens,
    bind(){load.bind();}};
}

let techDetailWeek=0;   // selected week in the Technicians tab
const ROLE_LABELS={any:'Any',robot:'SlipLift line',tray:'Heavy tray line',bench:'Bench only',line:'Install only',support:'Support only'};
const CAT_LABELS={main:'Main line',bench:'Bench',tray:'Trays & bins',support:'Support'};
function viewTechs(){
  const a=state.assumptions;
  const k=result.kpi;
  const nW=a.weeks;
  const capPerTechWk=5*result.cal.dayEff/60;
  // roster editor
  const rosterRows=state.technicians.map((tech,i)=>{
    const tt=result.techTotals[i]||{hours:0,util:0};
    return `<tr>
      <td class="num muted">${i+1}</td>
      <td><input type="text" style="width:100%" data-tech="${i}:name" value="${esc(tech.name)}"></td>
      <td><select data-tech="${i}:role">${Object.entries(ROLE_LABELS).map(([v,l])=>
        `<option value="${v}" ${tech.role===v?'selected':''}>${l}</option>`).join('')}</select></td>
      <td class="num">${hrs(tt.hours)}</td>
      <td class="num">${Math.round(tt.util*100)}%</td>
      <td><button class="small" data-techdel="${i}">✕</button></td></tr>`;
  }).join('');
  // tech x week load board
  const head=Array.from({length:nW},(_,w)=>`<th class="num">${result.cal.weeks[w].label}</th>`).join('');
  const board=state.technicians.map((tech,ti)=>{
    const cells=Array.from({length:nW},(_,w)=>{
      const c=result.techWeekly[ti][w];
      const tot=c.main+c.bench+c.tray+c.support;
      const ratio=Math.min(1,tot/Math.max(1,capPerTechWk));
      const pct=Math.round(ratio*62);
      return `<td class="num" data-cell="${ti}:${w}" style="background:color-mix(in srgb, var(--s1) ${pct}%, transparent)">${tot>0.05?hrs(tot):''}</td>`;
    }).join('');
    return `<tr><th style="white-space:nowrap">${esc(tech.name)}</th>${cells}</tr>`;
  }).join('');
  // weekly assignment detail, grouped by unit/work stream
  const wkOpts=Array.from({length:nW},(_,w)=>`<option value="${w}" ${w===techDetailWeek?'selected':''}>wk ${w+1} · ${result.cal.weeks[w].label}</option>`).join('');
  const ws=result.cal.weekStartEff(techDetailWeek),we=result.cal.weekEndEff(techDetailWeek);
  const detail=state.technicians.map((tech,ti)=>{
    const groups=new Map();
    result.tasks.forEach(x=>{
      if(x.tech!==ti||x.start==null)return;
      const ov=Math.min(x.end,we)-Math.max(x.start,ws);
      if(ov<=0.01)return;
      const key=(x.unit?x.unit+' · ':'')+(x.unit?CAT_LABELS[x.cat]:x.label);
      const g=groups.get(key)||{hours:0,n:0,cat:x.cat};
      g.hours+=ov/60;g.n++;groups.set(key,g);
    });
    if(!groups.size)return '';

        <tr><th>First (must finish)</th><th>Then (can start)</th><th></th></tr>

        <span>→</span>
        <select id="dep-after">${state.operations.filter(o=>o.type==='M').map(o=>`<option>${esc(o.name)}</option>`).join('')}</select>
        <button id="btn-add-dep" class="small">+ Add rule</button>
      </p>
    </div>`,
    bind(){
      document.querySelectorAll('[data-op]').forEach(inp=>{
        inp.addEventListener('change',()=>{
          const [i,f]=inp.dataset.op.split(':');
          const o=state.operations[+i];
          if(f==='minTotal'||f==='seq')o[f]=Math.max(0,+inp.value||0);
          else o[f]=inp.value;
          commit();
        });
      });
      document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
        state.operations.splice(+b.dataset.del,1);commit();
      });
      $('#btn-add-op').onclick=()=>{
        const maxSeq=Math.max(0,...state.operations.filter(o=>o.type==='M').map(o=>o.seq));
        state.operations.push({id:'op'+Date.now(),phase:state.operations[0]?.phase||'Lineside Install',
          seq:maxSeq+1,name:'New operation',minEach:10,minTotal:10,qty:1,type:'M'});
        commit();
      };
      document.querySelectorAll('[data-depdel]').forEach(b=>b.onclick=()=>{
        state.dependencies.splice(+b.dataset.depdel,1);commit();
      });
      $('#btn-add-dep').onclick=()=>{
        const before=$('#dep-before').value,after=$('#dep-after').value;
        if(before===after){alert('An op cannot depend on itself.');return;}
        if(state.dependencies.some(d=>d.before===before&&d.after===after)){alert('That rule already exists.');return;}
        // reject rules that would create a cycle
        const adj=new Map();
        [...state.dependencies,{before,after}].forEach(d=>{
          if(!adj.has(d.before))adj.set(d.before,[]);
          adj.get(d.before).push(d.after);
        });
        const seen=new Set(),stack=new Set();
        let cyclic=false;
        const dfs=n=>{
          if(stack.has(n)){cyclic=true;return;}
          if(seen.has(n))return;
          seen.add(n);stack.add(n);
          (adj.get(n)||[]).forEach(dfs);
          stack.delete(n);
        };
        adj.forEach((_,n)=>dfs(n));
        if(cyclic){alert('That rule would create a circular dependency.');return;}
        state.dependencies.push({before,after});commit();
      };
    }};
}

/* ---------- Scenario planner ---------- */
let scenResult=null, scenHires=null;
function applyScenario(base,sc){
  const st=JSON.parse(JSON.stringify(base));
  for(let i=0;i<(sc.addRobot||0);i++)st.technicians.push({name:'New hire (SlipLift) '+(i+1),role:'robot'});
  for(let i=0;i<(sc.addTray||0);i++)st.technicians.push({name:'New hire (Tray) '+(i+1),role:'tray'});
  for(let i=0;i<(sc.addAny||0);i++)st.technicians.push({name:'New hire '+(i+1),role:'any'});
  st.assumptions.techs=st.technicians.length;
  if(sc.ot!=null)st.assumptions.otHoursPerDay=sc.ot;
  if(sc.sat!=null)st.assumptions.satHoursPerWeek=sc.sat;
  if(sc.stations!=null)st.assumptions.stations=sc.stations;
  if(sc.bench!=null)st.assumptions.benchSeats=sc.bench;
  if(sc.crew!=null)st.assumptions.maxCrewPerRobot=sc.crew;
  if(sc.util!=null)st.assumptions.utilization=sc.util;
  return st;
}
function scenarioActive(sc){
  return (sc.addRobot||0)+(sc.addTray||0)+(sc.addAny||0)>0||sc.ot!=null||sc.sat!=null
    ||sc.stations!=null||sc.bench!=null||sc.crew!=null||sc.util!=null;
}
function viewScenario(){
  const a=state.assumptions;
  const sc=state.scenario;
  const active=scenarioActive(sc);
  if(active&&!scenResult)scenResult=runSchedule(applyScenario(state,sc));
  const b=result.kpi, s=scenResult?scenResult.kpi:null;
  const rate=a.loadedRate||31.64;
  const addHeads=(sc.addRobot||0)+(sc.addTray||0)+(sc.addAny||0);
  const hireCost=addHeads*40*a.weeks*rate;
  const otWk=((sc.ot!=null?sc.ot:a.otHoursPerDay)*5+(sc.sat!=null?sc.sat:a.satHoursPerWeek||0))
            -((a.otHoursPerDay||0)*5+(a.satHoursPerWeek||0));
  const otCost=Math.max(0,otWk)*(b.nTech)*a.weeks*rate*1.5;
  const num=(k,v,ph)=>`<label>${v}<input type="number" data-sc="${k}" placeholder="${ph}" value="${sc[k]==null?'':sc[k]}" step="${k==='util'?0.01:(k==='sat'||k==='ot'?0.5:1)}" min="0"></label>`;
  const add=(k,v)=>`<label>${v}<input type="number" data-sc="${k}" value="${sc[k]||0}" step="1" min="0" max="12"></label>`;
  function row(label,bv,sv,fmt,goodWhenLower){
    fmt=fmt||(x=>x);
    let delta='';
    if(s!=null&&typeof bv==='number'&&typeof sv==='number'&&Math.abs(sv-bv)>1e-9){
      const better=goodWhenLower?sv<bv:sv>bv;
      delta=` <span class="${better?'up':'down'}" style="color:var(${better?'--good-text':'--crit-text'})">${sv>bv?'▲':'▼'}${fmt(Math.abs(sv-bv))}</span>`;
    }
    return `<tr><td>${label}</td><td class="num">${typeof bv==='number'?fmt(bv):bv}</td>
      <td class="num">${s==null?'—':(typeof sv==='number'?fmt(sv):sv)}${delta}</td></tr>`;
  }
  const d1=x=>typeof x==='number'?x.toFixed(0):x;
  const baseLast=b.lastUnit&&b.lastUnit.finishDate?fmtMD(b.lastUnit.finishDate):'—';
  const scenLast=s&&s.lastUnit&&s.lastUnit.finishDate?fmtMD(s.lastUnit.finishDate):'—';
  const orderCmp=(state.orders||[]).map(o=>{
    const lateIn=res=>res.units.filter(x=>x.order===o.name&&x.late).length
      +res.tasks.filter(x=>!x.unit&&x.order===o.name&&x.start!=null&&x.end>x.due+1e-6).length;
    return row(esc(o.name)+' items late',lateIn(result),s?lateIn(scenResult):0,d1,true);
  }).join('');
  const hiresHtml=scenHires===null?'':(scenHires.n===0
    ?`<p class="sub">Even +8 flexible hires can't clear every due date — a structural constraint (stations, bench seats, or an order date) binds. Try levers above.</p>`
    :`<p class="sub"><b>${scenHires.n} flexible hire${scenHires.n>1?'s':''}</b> clears every due date (last unit ${scenHires.last}).
      BOY cost ≈ <b>$${hrs(scenHires.cost)}</b> at $${rate}/h loaded (40 h/wk × ${a.weeks} wks).
      Covering today's ${hrs(Math.max(0,b.demandHrs-b.capacityHrs))} h shortfall with 1.5× OT instead ≈ $${hrs(Math.max(0,b.demandHrs-b.capacityHrs)*rate*1.5)} —
      but that's ${(Math.max(0,b.demandHrs-b.capacityHrs)/a.weeks/b.nTech).toFixed(1)} extra h/head/wk on top of the standing OT.</p>`);
  return {html:alertsHtml()+`
    <div class="card">
      <h2>Scenario levers</h2>
      <p class="sub">Blank = keep current value. The scenario reruns the full schedule — nothing here changes your saved plan.</p>
      <div class="formgrid">
        ${add('addRobot','+ SlipLift-line hires')}
        ${add('addTray','+ Heavy-tray hires')}
        ${add('addAny','+ Flexible hires (any work)')}
        ${num('ot','OT hours/day/person',a.otHoursPerDay)}
        ${num('sat','Saturday hours/week/person',a.satHoursPerWeek||0)}
        ${num('stations','Main-line stations',a.stations)}
        ${num('bench','Bench seats',a.benchSeats)}
        ${num('crew','Max techs per robot',a.maxCrewPerRobot)}
        ${num('util','Utilization override (0–1)',a.utilization)}
        <label>Loaded labor rate ($/h)<input type="number" data-a-rate="1" value="${rate}" step="0.01" min="1"></label>
      </div>
      <p class="sub" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
        <button id="sc-hires" class="primary small">Find minimal hires to hit every date</button>
        <button id="sc-actual" class="small">Preset: recent actual pace (util 51%)</button>
        <button id="sc-clear" class="small">Clear scenario</button>
      </p>
      ${hiresHtml}
    </div>
    <div class="card">
      <h2>Baseline vs. scenario</h2>
      <p class="sub">${active?'Scenario applies: '+[
        (sc.addRobot||0)?`+${sc.addRobot} SlipLift`:'',(sc.addTray||0)?`+${sc.addTray} tray`:'',(sc.addAny||0)?`+${sc.addAny} flexible`:'',
        sc.ot!=null?`OT ${sc.ot}h/d`:'',sc.sat!=null?`Sat ${sc.sat}h/wk`:'',sc.stations!=null?`${sc.stations} stations`:'',
        sc.bench!=null?`${sc.bench} bench seats`:'',sc.crew!=null?`crew ${sc.crew}`:'',sc.util!=null?`util ${Math.round(sc.util*100)}%`:''
      ].filter(Boolean).join(' · '):'Set a lever above to compare.'}</p>
      <div class="tablewrap"><table class="data">
        <tr><th>Metric</th><th class="num">Baseline</th><th class="num">Scenario</th></tr>
        ${row('SlipLifts late',b.lateUnits,s?s.lateUnits:0,d1,true)}
        ${row('Last SlipLift completes',baseLast,scenLast)}
        ${row('Technicians',b.nTech,s?s.nTech:0,d1,false)}
        ${row('Capacity (h)',b.capacityHrs,s?s.capacityHrs:0,d1,false)}
        ${row('Demand − capacity (h)',b.demandHrs-b.capacityHrs,s?s.demandHrs-s.capacityHrs:0,d1,true)}
        ${row('Tech pool utilization (%)',b.utilizationOfPool*100,s?s.utilizationOfPool*100:0,x=>x.toFixed(0),true)}
        ${orderCmp}
      </table></div>
      ${active&&addHeads?`<p class="sub">Scenario hire cost ≈ <b>$${hrs(hireCost)}</b> BOY (${addHeads} × 40 h/wk × ${a.weeks} wks × $${rate}/h).${otWk>0?` Added OT/Sat cost ≈ $${hrs(otCost)} at 1.5×.`:''}</p>`:''}
    </div>`,
    bind(){
      document.querySelectorAll('[data-sc]').forEach(inp=>{
        inp.addEventListener('change',()=>{
          const k=inp.dataset.sc;
          if(k==='addRobot'||k==='addTray'||k==='addAny')sc[k]=Math.max(0,Math.round(+inp.value||0));
          else sc[k]=inp.value===''?null:Math.max(0,+inp.value);
          scenResult=scenarioActive(sc)?runSchedule(applyScenario(state,sc)):null;
          scenHires=null;saveState();render();
        });
      });
      document.querySelector('[data-a-rate]').addEventListener('change',e=>{
        state.assumptions.loadedRate=Math.max(1,+e.target.value||31.64);saveState();render();
      });
      $('#sc-clear').onclick=()=>{
        state.scenario={addRobot:0,addTray:0,addAny:0,ot:null,sat:null,stations:null,bench:null,crew:null,util:null};
        scenResult=null;scenHires=null;saveState();render();
      };
      $('#sc-actual').onclick=()=>{
        // MPP Capacity Plan: team converts ~36% of theoretical capacity vs 60% design ->
        // equivalent all-work utilization ~ 0.85 * 36/60 = 0.51
        sc.util=0.51;scenResult=runSchedule(applyScenario(state,sc));scenHires=null;saveState();render();
      };
      $('#sc-hires').onclick=()=>{
        let found=null;
        for(let n=1;n<=8;n++){
          const trial=JSON.parse(JSON.stringify(state.scenario));
          trial.addAny=(trial.addAny||0)+n;
          const r=runSchedule(applyScenario(state,trial));
          if(r.kpi.lateUnits===0&&r.kpi.unscheduled===0){
            const lu=r.kpi.lastUnit;
            found={n:(trial.addAny),last:lu&&lu.finishDate?fmtMD(lu.finishDate):'—',
              cost:trial.addAny*40*state.assumptions.weeks*(state.assumptions.loadedRate||31.64)};
            break;
          }
        }
        scenHires=found||{n:0};
        render();
      };
    }};
}

function viewAssumptions(){
  const a=state.assumptions;
  const num=(k,v,step,min,max)=>`<label>${v}<input type="number" step="${step}" min="${min}" ${max?`max="${max}"`:''} data-a="${k}" value="${a[k]}"></label>`;
  const recRows=state.recurring.map((r,i)=>`<tr>
    <td><input type="text" style="width:100%" data-rec="${i}:name" value="${esc(r.name)}"></td>
    <td class="num"><input type="number" min="0" data-rec="${i}:hrsPerWeek" value="${r.hrsPerWeek}"></td>
    <td><button class="small" data-recdel="${i}">✕</button></td></tr>`).join('');
  const chRows=state.chunks.map((c,i)=>`<tr>
    <td><input type="text" style="width:100%" data-ch="${i}:name" value="${esc(c.name)}"></td>
    <td class="num"><input type="number" min="0" data-ch="${i}:hours" value="${c.hours}"></td>
    <td class="num"><input type="number" min="1" max="${a.weeks}" style="width:56px" data-ch="${i}:startWeek" value="${c.startWeek}"></td>
    <td class="num"><input type="number" min="1" max="${a.weeks}" style="width:56px" data-ch="${i}:endWeek" value="${c.endWeek}"></td>
    <td><button class="small" data-chdel="${i}">✕</button></td></tr>`).join('');
  return {html:`
    <div class="card"><h2>Workforce &amp; calendar</h2>
      <p class="sub">Sources: headcount workbook (Jeff, 8/4/2026) and MBOM summary. Every value here is editable; the schedule recomputes immediately.</p>
      <div class="formgrid">
        ${num('techs','Direct-labor technicians (resizes roster)',1,1)}
        ${num('hoursPerDay','Straight-time hours per day per tech',0.5,1,16)}
        ${num('otHoursPerDay','Standing OT hours per day per person',0.5,0,8)}
        ${num('satHoursPerWeek','Saturday hours per week per person',0.5,0,12)}
        ${num('binHours','Man-hours per bin',1,0)}
        ${num('utilization','Direct-labor utilization (0–1)',0.01,0.3,1)}
        ${num('efficiency','Labor efficiency on MBOM times (0–1)',0.01,0.3,1)}
        ${num('ptoDays','Avg PTO days per head in horizon',1,0)}
        ${num('stations','Main-line stations (robots in parallel)',1,1,12)}
        <label>Main-line flow
          <select data-a="mainMode">
            <option value="dag" ${a.mainMode==='dag'?'selected':''}>Dependency graph (parallel crew)</option>
            <option value="serial" ${a.mainMode!=='dag'?'selected':''}>Serial, one op at a time</option>
          </select></label>
        ${num('maxCrewPerRobot','Max techs on one robot at once (graph mode)',1,1,6)}
        ${num('benchSeats','Bench seats (parallel bench workers)',1,1,20)}
        ${num('trayHours','Man-hours per tray',0.5,0)}
        ${num('weeks','Weeks in horizon',1,4,52)}
        ${num('leadWeeks','WIP lead time (weeks of head start before wk 1)',1,0,8)}
        <label>Horizon start (Monday)<input type="date" data-a="horizonStart" value="${a.horizonStart}"></label>
        <label>Bench must finish before line start
          <input type="checkbox" data-a="requireBenchBeforeMain" ${a.requireBenchBeforeMain?'checked':''}></label>
        <label style="grid-column:1/-1">Holidays (comma-separated ISO dates)
          <input type="text" style="flex:1" data-a="holidays" value="${a.holidays.join(', ')}"></label>
      </div>
    </div>
    <div class="card"><h2>Recurring base load (every week)</h2>
      <div class="tablewrap"><table class="data"><tr><th>Work stream</th><th class="num">Hrs/week</th><th></th></tr>${recRows}</table></div>
      <p class="sub"><button id="btn-add-rec" class="small">+ Add stream</button></p>
    </div>
    <div class="card"><h2>Discrete work chunks (not in build plan)</h2>
      <div class="tablewrap"><table class="data"><tr><th>Work chunk</th><th class="num">Man-hours</th><th class="num">From wk</th><th class="num">To wk</th><th></th></tr>${chRows}</table></div>
      <p class="sub"><button id="btn-add-ch" class="small">+ Add chunk</button></p>
    </div>`,
    bind(){
      document.querySelectorAll('[data-a]').forEach(inp=>{
        inp.addEventListener('change',()=>{
          const k=inp.dataset.a;
          if(k==='requireBenchBeforeMain')a[k]=inp.checked;
          else if(k==='holidays')a[k]=inp.value.split(',').map(s=>s.trim()).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s));
          else if(k==='horizonStart'||k==='mainMode')a[k]=inp.value||a[k];
          else a[k]=+inp.value||a[k];
          if(k==='weeks'){
            const w=Math.max(4,Math.min(52,Math.round(a.weeks)));a.weeks=w;
            while(state.buildPlan.length<w)state.buildPlan.push({slipLifts:0,heavyTrays:0,lightTrays:0});
            state.buildPlan.length=w;
            techDetailWeek=Math.min(techDetailWeek,w-1);
          }
          if(k==='techs'){
            const n=Math.max(1,Math.min(60,Math.round(a.techs)));a.techs=n;
            while(state.technicians.length<n)state.technicians.push({name:'Tech '+(state.technicians.length+1),role:'any'});
            state.technicians.length=n;
          }
          commit();
        });
      });
      const bindTable=(sel,arr,commitFn)=>{
        document.querySelectorAll(sel).forEach(inp=>{
          inp.addEventListener('change',()=>{
            const [i,f]=inp.dataset[commitFn].split(':');
            const row=arr[+i];
            row[f]=(f==='name')?inp.value:Math.max(0,+inp.value||0);
            commit();
          });
        });
      };
      bindTable('[data-rec]',state.recurring,'rec');
      bindTable('[data-ch]',state.chunks,'ch');
      document.querySelectorAll('[data-recdel]').forEach(b=>b.onclick=()=>{state.recurring.splice(+b.dataset.recdel,1);commit();});
      document.querySelectorAll('[data-chdel]').forEach(b=>b.onclick=()=>{state.chunks.splice(+b.dataset.chdel,1);commit();});
      $('#btn-add-rec').onclick=()=>{state.recurring.push({name:'New stream',hrsPerWeek:5});commit();};
      $('#btn-add-ch').onclick=()=>{state.chunks.push({name:'New chunk',hours:40,startWeek:1,endWeek:a.weeks});commit();};
    }};
}

function viewHelp(){
  return {html:`
  <div class="card help">
    <h2>How this tool works</h2>
    <p>This is a finite-capacity production scheduler for SlipLift assembly, seeded from the MBOM
    (<code>mbom_tree_260805_1436_ET_edited.xlsx</code>, 118 operations) and the tops-down headcount model
    (<code>BOY_Manufacturing_Headcount_TopsDown.xlsx</code>, 8/4/2026). All data lives in this page —
    no server, no login — and your edits persist in this browser (localStorage).</p>
    <h3>Scheduling model</h3>
    <p>Every SlipLift in the weekly build plan becomes 118 tasks: bench subassembly ops (run in parallel,
    limited by <b>bench seats</b> and technicians) and main-line ops (run in sequence per robot, limited by
    <b>stations</b> and technicians). Trays, recurring base load, and discrete work chunks compete for the
    same technician pool. The scheduler dispatches by earliest due date; MBOM touch times are divided by the
    labor-efficiency factor, and each workday is shrunk by utilization and pro-rated PTO. Weekends and the
    listed holidays are skipped.</p>
    <h3>Technicians</h3>
    <p>The Technicians tab holds the named roster the scheduler assigns work to. Each tech has a role —
    <b>Any</b>, <b>Bench</b> (subassembly + trays), <b>Line</b> (main-line installs), or <b>Support</b>
    (recurring/chunk work + trays) — and the dispatcher only hands a task to an eligible, free technician
    (round-robin, so load spreads evenly). The load board shows hours per tech per week; the week detail
    table lists each tech's assignments; <b>Export assignments CSV</b> produces the full task-level
    assignment list for the MES.</p>
    <h3>Bulk-editing the build plan</h3>
    <p>Use the bulk-edit bar in the Build Plan tab to set, add to, or scale SlipLifts or trays across any
    week range (e.g., weeks 1–8 SlipLifts set to 3), then fine-tune individual weeks in the table.</p>
    <h3>Scenario planner</h3>
    <p>The Scenario tab reruns the whole schedule with what-if levers — hires by line, OT, Saturday hours,
    stations, bench seats, crew size, or a utilization override — without touching your saved plan, and shows
    baseline-vs-scenario deltas per order. "Find minimal hires" searches for the smallest flexible-hire count that
    clears every due date and prices it against 1.5× overtime at your loaded rate. The "recent actual pace" preset
    applies the ~51% utilization implied by the team's measured earned-rate (36% of theoretical vs 60% design).</p>
    <h3>Reading the dashboard</h3>
    <p>The stacked chart is scheduled load; the dashed line is capacity. ▲ marks weeks where load exceeds
    capacity — the scheduler will push that work later, which is what makes units go red in the Schedule tab.
    The headcount tiles reproduce the tops-down math (effective hours per head = workdays × hours × PTO factor ×
    utilization) so you can sanity-check against the spreadsheet.</p>
    <h3>Using it in the MES</h3>
    <p>Host this single file anywhere the MES can reach (an internal web server, SharePoint page, or the MES's
    own web-content widget) and embed it via <code>&lt;iframe src=".../index.html"&gt;</code>. Use
    <b>Export schedule CSV</b> to hand the dispatch list (unit, start, completion, status) to MES work orders,
    and <b>Export data JSON</b> / <b>Import data JSON</b> to share scenarios between people or machines.</p>
    <h3>Updating for a new MBOM rev</h3>
    <p>Edit operations directly in the Operations tab, or regenerate the seed block from a new
    <code>operations_all</code> export and re-import via JSON. Durations are minutes per robot,
    before efficiency.</p>
    <h3>Main-line flow modes</h3>
    <p><b>Dependency graph</b> (default) uses the MBOM dependencies sheet: ops not ordered by a rule may run in
    parallel on the same robot, up to the "max techs on one robot" crew limit, and the robot holds its station from
    first op to last. <b>Serial</b> forces one op at a time in Seq order — the conservative single-tech-per-robot
    model (≈39 station-hours per robot). Utilization here (85%) covers meetings/5S/breaks only, because rework,
    chunks, and field work are scheduled explicitly — it maps to the workbook's "60% build-only utilization"
    convention where those are folded into the other 40%.</p>
    <h3>Customer orders vs build-to-stock</h3>
    <p>Demand comes from two places, matching the Master Production Plan: <b>orders</b> (Home Depot, Corning,
    SpaceX, Mercado Libre) carry hard handoff dates and % complete from NetSuite work orders — only the remaining
    work is scheduled; the <b>weekly plan</b> is build-to-stock on top, seeded as the v2 forecast minus the order
    units. Together they preserve the forecast totals (42 lifts, 45 heavy trays, 60 light trays + 10 bins).</p>
    <h3>Known assumptions</h3>
    <p>• Order quantities, handoff dates, and % complete from the Master Production Plan as of 8/7/2026 — update
    them in the Build Plan tab as work orders progress.<br>
    • Calendar per the Capacity Plan tab: 7 straight-time hours + 1 standing OT hour per day.<br>
    • Roster split per the Capacity Plan tab: 4 SlipLift-line techs, 3 heavy-tray-line techs (lines not
    interchangeable — set roles to Any to model a fungible crew); the headcount workbook says 11 heads are required.<br>
    • Bench work for a robot must finish before line ops with no upstream rule (toggle in Assumptions).<br>
    • WIP lead time gives the line a head start before week 1 (default 2 weeks), modelling subassemblies and robots already in flight on the horizon start date.<br>
    • Labor is fungible across streams except where technician roles restrict it.<br>
    • The 14 light-tray December gap from the forecast is flagged until you add it to the plan.</p>
  </div>`,bind(){}};
}

/* ============================== HEADER ACTIONS ============================== */
function exportCSV(){
  const lines=[['unit','order','due_date','bench_start','line_start','completion','status','late_days'].join(',')];
  result.units.forEach(u=>{
    lines.push([u.unit,csvq(u.order||'stock'),fmtISO(u.dueDate),
      u.benchStartDate?fmtISO(u.benchStartDate):'',u.mainStartDate?fmtISO(u.mainStartDate):'',
      u.finishDate?fmtISO(u.finishDate):'',u.late?'LATE':'ON_TIME',u.lateDays].join(','));
  });
  lines.push('');
  lines.push(['week_start','sliplifts','heavy_trays','light_trays','load_hours','capacity_hours'].join(','));
  state.buildPlan.forEach((w,i)=>{
    const load=result.weekly.build[i]+result.weekly.tray[i]+result.weekly.support[i];
    lines.push([fmtISO(result.cal.weeks[i].start),w.slipLifts||0,w.heavyTrays||0,w.lightTrays||0,
      load.toFixed(1),result.capacity[i].toFixed(1)].join(','));
  });
  download('sliplift_schedule.csv',lines.join('\n'),'text/csv');
}
function download(name,content,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type:mime}));
  a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
document.getElementById('btn-export-csv').onclick=exportCSV;
document.getElementById('btn-export').onclick=()=>download('sliplift_scheduler_data.json',JSON.stringify(state,null,1),'application/json');
document.getElementById('btn-import').onclick=()=>document.getElementById('file-import').click();
document.getElementById('file-import').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(txt=>{
    try{
      const s=JSON.parse(txt);
      if(!s||s.version!==1||!Array.isArray(s.operations)||!Array.isArray(s.buildPlan))throw new Error('Not a scheduler data file.');
      state=s;commit();
    }catch(err){alert('Import failed: '+err.message);}
    e.target.value='';
  });
});
document.getElementById('btn-print').onclick=()=>window.print();
document.getElementById('btn-reset').onclick=()=>{
  if(confirm('Replace all edits with the original seed data (MBOM 8/5 + headcount 8/4)?')){
    state=seedState();commit();
  }
};

recompute();
render();
</script>
