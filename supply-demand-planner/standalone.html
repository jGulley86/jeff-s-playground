@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
.sdp *{box-sizing:border-box;}
.sdp{min-height:100vh;background:${D.canvas};color:${D.text};font-family:'Inter',system-ui,sans-serif;padding:0 0 48px;font-size:13px;}
.sdp .mono{font-family:'JetBrains Mono',monospace;}
.sdp .dim{color:${D.muted};font-weight:400;}
.sdp .hot-text{color:${D.red};}
.head{padding:16px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;border-bottom:1px solid ${D.border};}
.brand{font-weight:600;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:${D.sub};}
.title{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.01em;}
.title .dim{font-size:12.5px;font-weight:500;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;background:${D.panel};border:1px solid ${D.border};color:${D.sub};}
.chip b{color:${D.text};font-weight:600;}
.chip.ok{border-color:#1E4636;color:#7EDDB4;background:#0E1E18;}
.chip.hot{border-color:#4A2626;color:#F5A19B;background:#1E1112;}
.draft-dot{color:${D.warn};font-weight:600;}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px;}
.cadence{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap;align-items:stretch;}
.cad{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid ${D.borderSoft};border-radius:8px;background:${D.panel};}
.cad.now{border-color:${D.indigo};background:#161634;}
.cad-k{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:${D.muted};}
.cad.now .cad-k{color:${D.indigoSoft};}
.cad-t{font-weight:600;font-size:12.5px;}
.cad-w{font-size:11px;color:${D.muted};}
.cad-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.card{background:${D.panel};border:1px solid ${D.border};border-radius:12px;padding:18px 20px;margin-top:16px;}
.card h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;}
.card h3{font-weight:700;font-size:14px;margin:0 0 8px;}
.card h4{font-weight:700;font-size:12px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.1em;color:${D.sub};}
.card .sub{font-size:12px;color:${D.muted};margin:4px 0 0;line-height:1.5;max-width:70ch;}
.card-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.head-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:1000px){.two{grid-template-columns:1fr;}}
.mode{display:inline-flex;background:${D.inset};border:1px solid ${D.border};border-radius:10px;overflow:hidden;padding:3px;gap:3px;}
.mode button{font:500 12.5px 'Inter';padding:7px 14px;border:none;background:transparent;color:${D.sub};cursor:pointer;border-radius:7px;}
.mode button.on{background:${D.indigo};color:#fff;font-weight:600;}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center;margin-top:16px;}
@media(max-width:980px){.hero{grid-template-columns:1fr;}}
.inputs{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;}
.ask-side{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;}
.stepper label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;}
.stepper-row{display:flex;align-items:stretch;border:1.5px solid var(--acc);border-radius:10px;overflow:hidden;background:${D.inset};}
.stepper-row button{width:40px;font:600 20px 'Inter';border:none;background:${D.panel};color:${D.sub};cursor:pointer;}
.stepper-row button:hover{background:var(--acc);color:#0A0D13;}
.stepper-row input{width:80px;border:none;text-align:center;font:700 34px 'Inter';color:${D.text};background:${D.inset};padding:4px 0;-moz-appearance:textfield;}
.stepper-row input::-webkit-outer-spin-button,.stepper-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.stepper-row input:focus{outline:none;background:#141a28;}
.tray-col{display:flex;flex-direction:column;gap:8px;}
.type-seg{display:flex;border:1px solid ${D.border};border-radius:8px;overflow:hidden;background:${D.inset};padding:2px;gap:2px;}
.type-seg button{flex:1;font:600 11px 'Inter';letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:none;background:transparent;cursor:pointer;color:${D.muted};border-radius:6px;}
.type-seg button.h.on{background:#0E2334;color:${D.sky};}
.type-seg button.l.on{background:#2A1230;color:${D.pink};}
.link-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:${D.sub};font-weight:500;cursor:pointer;user-select:none;}
.link-toggle input{accent-color:${D.indigo};width:15px;height:15px;}
.sdp select,.sdp input.text,.sdp .hold-name,.sdp .consensus input{font:500 13px 'Inter';padding:8px 10px;border:1px solid ${D.border};border-radius:8px;background:${D.inset};color:${D.text};}
.sdp select:focus,.sdp input:focus{outline:2px solid ${D.indigo};outline-offset:0;}
label.small{display:block;font-size:11.5px;font-weight:600;color:${D.sub};margin:10px 0 4px;}
.tag{position:relative;border:1px dashed ${D.border};border-radius:12px;padding:16px 20px 16px 48px;background:${D.inset};display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;}
.tag::before{content:"";position:absolute;left:18px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:${D.canvas};border:2px solid ${D.border};}
.tag.green{border-color:#2A6A4E;background:#0D1F17;}.tag.green::before{border-color:${D.green};}
.tag.tight{border-color:#6B5320;background:#1D1810;}.tag.tight::before{border-color:${D.warn};}
.tag.later,.tag.none{border-color:#6B3030;background:#1F1213;}.tag.later::before,.tag.none::before{border-color:${D.red};}
.verdict{font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1;}
.tag.green .verdict{color:${D.green}}.tag.tight .verdict{color:${D.warn}}.tag.later .verdict,.tag.none .verdict{color:${D.red}}.tag.idle .verdict{color:${D.muted}}
.stamp{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.01em;}
.stamp small{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:${D.muted};margin-bottom:4px;}
.tag-detail{font-size:12px;color:${D.sub};max-width:420px;line-height:1.5;}
.gap-note{color:${D.warn};font-weight:600;}
.tag-actions{display:flex;gap:8px;flex-basis:100%;margin-top:8px;flex-wrap:wrap;align-items:center;}
.btn{font:600 12px 'Inter';padding:8px 14px;border-radius:8px;border:1px solid ${D.indigo};background:${D.indigo};color:#fff;cursor:pointer;}
.btn.ghost{background:transparent;color:${D.indigoSoft};}
.btn.warn{background:transparent;border-color:${D.warn};color:${D.warn};}
.btn.danger{background:transparent;border-color:#6B3030;color:${D.red};}
.btn:hover:not(:disabled){filter:brightness(1.15);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:focus-visible,.mini:focus-visible{outline:2px solid ${D.text};}
.mini{font:600 11px 'Inter';padding:4px 9px;border-radius:6px;border:1px solid ${D.border};background:${D.raise};color:${D.text};cursor:pointer;}
.mini.danger{color:${D.red};border-color:#4A2626;}
.hold-name{width:190px;}
.hold-name::placeholder{color:${D.muted};}
.heat-scroll{overflow-x:auto;padding-bottom:4px;margin-top:16px;}
.heat{display:flex;gap:3px;min-width:900px;}
.cell{flex:1;border-radius:6px;padding:7px 2px 6px;text-align:center;cursor:default;border:1px solid transparent;}
.cell .k{font:700 16px 'Inter';line-height:1;}
.cell .d{font:500 8.5px 'JetBrains Mono',monospace;opacity:.8;margin-top:4px;letter-spacing:.02em;}
.cell.past{background:transparent;color:${D.muted};border-color:${D.borderSoft};opacity:.6;}
.cell.g0{background:#12161F;color:#525C72;border-color:${D.borderSoft};}
.cell.g1{background:#251A0C;color:#C98A2B;}
.cell.g2{background:#33230C;color:${D.amber};}
.cell.g3{background:#0E241C;color:#4EC393;}
.cell.g4{background:#0F3226;color:#6EE7B7;}
.cell.gated{outline:1.5px dashed #6B5320;outline-offset:-2px;}
.cell.now{box-shadow:inset 0 0 0 1.5px ${D.indigoSoft};}
.cell.cond{border-bottom:2px dashed ${D.red};}
.heat-legend{display:flex;gap:14px;font-size:11px;color:${D.muted};margin-top:8px;flex-wrap:wrap;}
.lg{display:flex;align-items:center;gap:5px;font-size:11.5px;}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:${D.sub};}
.stage-chip{font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1.5px solid ${D.indigo};color:${D.indigoSoft};white-space:nowrap;}
.st-po{background:${D.indigo};color:#fff;border-style:solid;}
.st-contract{background:rgba(110,98,245,.28);border-style:solid;}
.st-negotiation{background:transparent;border-style:dashed;}
.st-soft{background:transparent;border-style:dotted;border-color:${D.sub};color:${D.sub};}
.st-estimate{background:transparent;border-style:dotted;border-color:${D.muted};color:${D.muted};opacity:.8;}
.grid-scroll{overflow-x:auto;margin-top:12px;border:1px solid ${D.borderSoft};border-radius:8px;}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%;}
table.grid th,table.grid td{padding:0;border-bottom:1px solid ${D.borderSoft};border-right:1px solid ${D.borderSoft};text-align:center;min-width:54px;height:34px;vertical-align:middle;}
table.grid th{font:600 11px 'JetBrains Mono',monospace;color:${D.sub};background:${D.raise};position:sticky;top:0;z-index:2;padding:4px 2px;}
table.grid th .q{font-size:9px;color:${D.muted};height:11px;letter-spacing:.08em;text-transform:uppercase;}
table.grid .sticky{position:sticky;left:0;z-index:3;background:${D.panel};text-align:left;padding:4px 10px;min-width:230px;border-right:1px solid ${D.border};}
table.grid th.sticky{background:${D.raise};z-index:4;}
table.grid td.now,table.grid th.now{background:rgba(110,98,245,.10);}
table.grid td.past,table.grid th.past{background:rgba(255,255,255,.015);}
table.grid tr.dep{cursor:pointer;}
table.grid tr.dep:hover td{background:rgba(110,98,245,.06);}
table.grid tr.dep:focus-visible{outline:2px solid ${D.indigoSoft};}
table.grid tr.proposed .sticky{border-left:3px solid ${D.warn};}
.cust{font-weight:600;color:${D.text};display:flex;gap:6px;align-items:center;}
.rev{font:600 9px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:${D.warn};border:1px solid ${D.warn};border-radius:4px;padding:1px 5px;}
.site{margin-top:3px;display:flex;gap:6px;align-items:center;font-size:11px;}
.pill{display:inline-flex;gap:4px;align-items:center;padding:3px 7px;border-radius:6px;border:1.5px solid ${D.indigo};font:700 12px 'JetBrains Mono',monospace;background:${D.inset};}
.pill.st-po{background:${D.indigo};}
.pill.st-po span{color:#fff !important;}
.pill.st-contract{background:rgba(110,98,245,.22);}
.pill.st-soft,.pill.st-estimate{border-color:${D.sub};}
.qty{display:inline-flex;gap:4px;font-variant-numeric:tabular-nums;}
table.grid tr.sep td{background:${D.raise};font-size:11.5px;font-weight:600;height:28px;border-right:none;text-align:left;}
table.grid tr.num td{font-variant-numeric:tabular-nums;}
table.grid tr.num .sticky{font-weight:500;color:${D.sub};}
table.grid tr.end .sticky{font-weight:600;color:${D.text};}
table.grid tr.supply td{background:rgba(255,255,255,.02);}
.cellin{width:100%;height:32px;border:none;background:transparent;color:${D.text};text-align:center;font:600 12px 'JetBrains Mono',monospace;-moz-appearance:textfield;}
.cellin::-webkit-outer-spin-button,.cellin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.cellin:focus{outline:2px solid ${D.indigo};outline-offset:-2px;background:#141a28;}
.cellin.over{color:${D.red};}
table.grid td.changed{background:rgba(251,191,36,.12);}
.past-build{font:600 12px 'JetBrains Mono',monospace;color:${D.sub};}
.past-build.miss{color:${D.warn};}
.past-build small{font-size:9px;color:${D.muted};}
.dem{color:${D.sub};font:600 11.5px 'JetBrains Mono',monospace;}
.bal{display:inline-block;min-width:34px;padding:3px 6px;border-radius:5px;font:700 12px 'JetBrains Mono',monospace;}
.bal.ok{color:${D.text};}
.bal.buf{color:${D.warn};background:rgba(251,191,36,.10);}
.bal.neg{color:#fff;background:#8B2F2F;}
.hint{font-size:11px;color:${D.muted};margin-top:8px;line-height:1.55;}
.rollup-wrap{overflow-x:auto;margin-top:14px;}
table.rollup,table.pva,table.gaps{border-collapse:collapse;font-size:12px;width:100%;}
table.rollup th,table.pva th,table.gaps th{font:600 10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:${D.muted};text-align:left;padding:5px 8px;border-bottom:1px solid ${D.border};}
table.rollup td,table.pva td,table.gaps td{padding:6px 8px;border-bottom:1px solid ${D.borderSoft};color:${D.sub};}
table.rollup th{text-align:center;}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${D.text};}
td.n.neg{color:${D.red};}
table.gaps td.cust{color:${D.text};font-weight:600;}
.signals{display:grid;gap:10px;margin-top:12px;}
.signal{display:flex;gap:10px;font-size:12.5px;line-height:1.55;color:${D.sub};background:${D.inset};border:1px solid ${D.borderSoft};border-left:3px solid ${D.indigo};padding:11px 13px;border-radius:8px;}
.signal.red{border-left-color:${D.red};}
.signal.amber{border-left-color:${D.warn};}
.signal.ok{border-left-color:${D.green};}
.signal.acked{opacity:.7;}
.sig-body{flex:1;min-width:0;}
.sig-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px;}
.sig-title b{color:${D.text};}
.owner{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:${D.indigoSoft};border:1px solid ${D.border};border-radius:4px;padding:1px 6px;}
.sig-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.queue-item{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border:1px solid ${D.borderSoft};border-radius:6px;background:${D.panel};}
.small-note{font-size:11px;margin-top:6px;}
.plan-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;margin-top:12px;font-size:12.5px;}
.plan-meta .k{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:${D.muted};margin-bottom:3px;}
.plan-meta .consensus{grid-column:1 / -1;}
.plan-meta .consensus input{width:100%;}
.oc{color:${D.warn};font-weight:600;}
.onc{color:${D.green};font-weight:600;}
.draft{margin-top:14px;padding:14px;border:1px dashed ${D.warn};border-radius:10px;background:rgba(251,191,36,.05);}
.draft-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.delta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.delta-item{font:500 11.5px 'JetBrains Mono',monospace;padding:3px 7px;border-radius:5px;background:${D.inset};border:1px solid ${D.borderSoft};color:${D.sub};}
.delta-item b{color:${D.text};}
.ramif{font-size:12px;color:${D.sub};margin-top:8px;line-height:1.7;}
.ramif span{margin-right:10px;}
.checklist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:5px;}
.checklist li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;font-size:12px;align-items:baseline;}
.checklist li.ok .tick{color:${D.green};font-weight:700;}
.checklist li.no .tick{color:${D.red};font-weight:700;}
.checklist li.no{color:${D.text};}
.ledger{list-style:none;margin:0;padding:0;font-size:12px;color:${D.sub};display:grid;gap:5px;}
.ledger b{color:${D.text};}
.empty{font-size:12px;color:${D.muted};padding:10px 4px;line-height:1.5;}
.rm{border:none;background:none;color:${D.red};font-weight:700;cursor:pointer;font-size:14px;line-height:1;}
.assump{margin-top:12px;}
.assump-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.assump-card{background:${D.inset};border:1px solid ${D.borderSoft};border-radius:8px;padding:12px;}
.assump-card h4{margin:0 0 8px;}
.assump-card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:${D.sub};padding:4px 0;}
.assump-card .row input{width:110px;font:600 12px 'JetBrains Mono',monospace;padding:5px 8px;border:1px solid ${D.border};border-radius:6px;background:${D.panel};color:${D.text};text-align:right;}
.foot{margin-top:24px;font-size:11.5px;color:${D.muted};line-height:1.65;max-width:100ch;}
.foot b{color:${D.sub};}
.modal-bg{position:fixed;inset:0;background:rgba(5,7,12,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:${D.panel};border:1px solid ${D.border};border-radius:12px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto;}
.modal h3{margin:0 0 12px;font-size:15px;}
.form{display:grid;gap:10px;}
.form label{display:grid;gap:4px;font-size:11.5px;font-weight:600;color:${D.sub};}
.form input,.form select{font:500 13px 'Inter';padding:8px 10px;border:1px solid ${D.border};border-radius:8px;background:${D.inset};color:${D.text};}
.form .qty-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.form .check{display:flex;align-items:center;gap:8px;}
.form .check input{accent-color:${D.indigo};}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:${D.text};color:${D.canvas};font-weight:600;font-size:12.5px;padding:9px 14px;border-radius:8px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4);}
@media (prefers-reduced-motion: reduce){.sdp *{transition:none!important;animation:none!important;}}
