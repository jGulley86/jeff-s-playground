.head{padding:16px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;border-bottom:1px solid ${I.border};}
.brand{font-weight:600;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:${I.sub};}
.title{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.01em;}
.title .dim{font-size:12.5px;font-weight:500;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;background:${I.panel};border:1px solid ${I.border};color:${I.sub};}
.chip b{color:${I.text};font-weight:600;}
.chip.ok{border-color:#1E4636;color:#7EDDB4;background:#0E1E18;}
.chip.hot{border-color:#4A2626;color:#F5A19B;background:#1E1112;}
.who{font:500 12px 'Inter';padding:7px 10px;border:1px solid ${I.border};border-radius:8px;background:${I.inset};color:${I.text};width:190px;}
.who::placeholder{color:${I.muted};}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px;}
.kpi{background:${I.panel};border:1px solid ${I.border};border-radius:10px;padding:10px 14px;display:grid;gap:4px;}
.kpi.bad{border-color:#4A2626;}
.kpi-name{font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px;}
.kpi-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:${I.sub};}
.kpi-row b{color:${I.text};font-variant-numeric:tabular-nums;font-weight:700;}
.kpi-row b small{color:${I.warn};margin-left:2px;}
.slots{display:flex;flex-direction:column;gap:5px;padding-bottom:6px;}
.slots-k{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:${I.muted};}
.slot{display:flex;gap:6px;align-items:baseline;font:700 12px 'Inter';padding:5px 9px;border-radius:7px;border:1px solid ${I.border};background:${I.inset};color:${I.sub};cursor:pointer;}
.slot small{font:500 10px 'JetBrains Mono',monospace;color:${I.muted};}
.slot.on{border-color:${I.indigo};color:${I.text};background:rgba(110,98,245,.14);}
.seg{display:inline-flex;border:1px solid ${I.border};border-radius:8px;overflow:hidden;background:${I.inset};padding:2px;gap:2px;}
.seg button{font:500 11.5px 'Inter';padding:6px 10px;border:none;background:transparent;cursor:pointer;color:${I.sub};border-radius:6px;}
.seg button.on{background:${I.indigo};color:#fff;font-weight:600;}
.miles{display:flex;gap:0;margin-top:14px;overflow-x:auto;padding:12px 0 4px;border-top:1px dashed ${I.borderSoft};}
.mile{flex:1;min-width:130px;position:relative;padding:0 10px 0 0;}
.mile::before{content:"";position:absolute;top:6px;left:14px;right:0;height:1.5px;background:${I.border};}
.mile:last-child::before{display:none;}
.mile-dot{width:13px;height:13px;border-radius:50%;background:${I.canvas};border:3px solid ${I.indigo};position:relative;z-index:1;}
.mile.due .mile-dot{background:${I.warn};border-color:${I.warn};}
.mile-wk{font:600 12px 'JetBrains Mono',monospace;margin-top:8px;color:${I.text};}
.mile-label{font-size:11px;font-weight:600;color:${I.sub};line-height:1.35;margin-top:2px;}
.mile-owner{font-size:10.5px;color:${I.muted};margin-top:2px;}
.draft-dot{color:${I.warn};font-weight:600;}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px;}
.cadence{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap;align-items:stretch;}
.cad{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid ${I.borderSoft};border-radius:8px;background:${I.panel};}
.cad.now{border-color:${I.indigo};background:#161634;}
.cad-k{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:${I.muted};}
.cad.now .cad-k{color:${I.indigoSoft};}
.cad-t{font-weight:600;font-size:12.5px;}
.cad-w{font-size:11px;color:${I.muted};}
.cad-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.card{background:${I.panel};border:1px solid ${I.border};border-radius:12px;padding:18px 20px;margin-top:16px;}
.card h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;}
.card h3{font-weight:700;font-size:14px;margin:0 0 8px;}
.card h4{font-weight:700;font-size:12px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.1em;color:${I.sub};}
.card .sub{font-size:12px;color:${I.muted};margin:4px 0 0;line-height:1.5;max-width:70ch;}
.card-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.head-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:1000px){.two{grid-template-columns:1fr;}}
.mode{display:inline-flex;background:${I.inset};border:1px solid ${I.border};border-radius:10px;overflow:hidden;padding:3px;gap:3px;}
.mode button{font:500 12.5px 'Inter';padding:7px 14px;border:none;background:transparent;color:${I.sub};cursor:pointer;border-radius:7px;}
.mode button.on{background:${I.indigo};color:#fff;font-weight:600;}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center;margin-top:16px;}
@media(max-width:980px){.hero{grid-template-columns:1fr;}}
.inputs{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;}
.ask-side{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;}
.stepper label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;}
.stepper-row{display:flex;align-items:stretch;border:1.5px solid var(--acc);border-radius:10px;overflow:hidden;background:${I.inset};}
.stepper-row button{width:40px;font:600 20px 'Inter';border:none;background:${I.panel};color:${I.sub};cursor:pointer;}
.stepper-row button:hover{background:var(--acc);color:#0A0D13;}
.stepper-row input{width:80px;border:none;text-align:center;font:700 34px 'Inter';color:${I.text};background:${I.inset};padding:4px 0;-moz-appearance:textfield;}
.stepper-row input::-webkit-outer-spin-button,.stepper-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.stepper-row input:focus{outline:none;background:#141a28;}
.tray-col{display:flex;flex-direction:column;gap:8px;}
.type-seg{display:flex;border:1px solid ${I.border};border-radius:8px;overflow:hidden;background:${I.inset};padding:2px;gap:2px;}
.type-seg button{flex:1;font:600 11px 'Inter';letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:none;background:transparent;cursor:pointer;color:${I.muted};border-radius:6px;}
.type-seg button.h.on{background:#0E2334;color:${I.sky};}
.type-seg button.l.on{background:#2A1230;color:${I.pink};}
.link-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:${I.sub};font-weight:500;cursor:pointer;user-select:none;}
.link-toggle input{accent-color:${I.indigo};width:15px;height:15px;}
.sdp select,.sdp input.text,.sdp .hold-name,.sdp .consensus input{font:500 13px 'Inter';padding:8px 10px;border:1px solid ${I.border};border-radius:8px;background:${I.inset};color:${I.text};}
.sdp select:focus,.sdp input:focus{outline:2px solid ${I.indigo};outline-offset:0;}
label.small{display:block;font-size:11.5px;font-weight:600;color:${I.sub};margin:10px 0 4px;}
.tag{position:relative;border:1px dashed ${I.border};border-radius:12px;padding:16px 20px 16px 48px;background:${I.inset};display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;}
.tag::before{content:"";position:absolute;left:18px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:${I.canvas};border:2px solid ${I.border};}
.tag.green{border-color:#2A6A4E;background:#0D1F17;}.tag.green::before{border-color:${I.green};}
.tag.tight{border-color:#6B5320;background:#1D1810;}.tag.tight::before{border-color:${I.warn};}
.tag.later,.tag.none{border-color:#6B3030;background:#1F1213;}.tag.later::before,.tag.none::before{border-color:${I.red};}
.verdict{font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1;}
.tag.green .verdict{color:${I.green}}.tag.tight .verdict{color:${I.warn}}.tag.later .verdict,.tag.none .verdict{color:${I.red}}.tag.idle .verdict{color:${I.muted}}
.stamp{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.01em;}
.stamp small{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:${I.muted};margin-bottom:4px;}
.tag-detail{font-size:12px;color:${I.sub};max-width:420px;line-height:1.5;}
.gap-note{color:${I.warn};font-weight:600;}
.tag-actions{display:flex;gap:8px;flex-basis:100%;margin-top:8px;flex-wrap:wrap;align-items:center;}
.btn{font:600 12px 'Inter';padding:8px 14px;border-radius:8px;border:1px solid ${I.indigo};background:${I.indigo};color:#fff;cursor:pointer;}
.btn.ghost{background:transparent;color:${I.indigoSoft};}
.btn.warn{background:transparent;border-color:${I.warn};color:${I.warn};}
.btn.danger{background:transparent;border-color:#6B3030;color:${I.red};}
.btn:hover:not(:disabled){filter:brightness(1.15);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:focus-visible,.mini:focus-visible{outline:2px solid ${I.text};}
.mini{font:600 11px 'Inter';padding:4px 9px;border-radius:6px;border:1px solid ${I.border};background:${I.raise};color:${I.text};cursor:pointer;}
.mini.danger{color:${I.red};border-color:#4A2626;}
.hold-name{width:190px;}
.hold-name::placeholder{color:${I.muted};}
.heat-scroll{overflow-x:auto;padding-bottom:4px;margin-top:16px;}
.heat{display:flex;gap:3px;min-width:900px;}
.cell{flex:1;border-radius:6px;padding:7px 2px 6px;text-align:center;cursor:default;border:1px solid transparent;}
.cell .k{font:700 16px 'Inter';line-height:1;}
.cell .d{font:500 8.5px 'JetBrains Mono',monospace;opacity:.8;margin-top:4px;letter-spacing:.02em;}
.cell.past{background:transparent;color:${I.muted};border-color:${I.borderSoft};opacity:.6;}
.cell.g0{background:#12161F;color:#525C72;border-color:${I.borderSoft};}
.cell.g1{background:#251A0C;color:#C98A2B;}
.cell.g2{background:#33230C;color:${I.amber};}
.cell.g3{background:#0E241C;color:#4EC393;}
.cell.g4{background:#0F3226;color:#6EE7B7;}
.cell.gated{outline:1.5px dashed #6B5320;outline-offset:-2px;}
.cell.now{box-shadow:inset 0 0 0 1.5px ${I.indigoSoft};}
.cell.cond{border-bottom:2px dashed ${I.red};}
.heat-legend{display:flex;gap:14px;font-size:11px;color:${I.muted};margin-top:8px;flex-wrap:wrap;}
.lg{display:flex;align-items:center;gap:5px;font-size:11.5px;}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:${I.sub};}
.stage-chip{font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1.5px solid ${I.indigo};color:${I.indigoSoft};white-space:nowrap;}
.st-po{background:${I.indigo};color:#fff;border-style:solid;}
.st-contract{background:rgba(110,98,245,.28);border-style:solid;}
.st-negotiation{background:transparent;border-style:dashed;}
.st-soft{background:transparent;border-style:dotted;border-color:${I.sub};color:${I.sub};}
.st-estimate{background:transparent;border-style:dotted;border-color:${I.muted};color:${I.muted};opacity:.8;}
.grid-scroll{overflow-x:auto;margin-top:12px;border:1px solid ${I.borderSoft};border-radius:8px;}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%;}
table.grid th,table.grid td{padding:0;border-bottom:1px solid ${I.borderSoft};border-right:1px solid ${I.borderSoft};text-align:center;min-width:54px;height:34px;vertical-align:middle;}
table.grid th{font:600 11px 'JetBrains Mono',monospace;color:${I.sub};background:${I.raise};position:sticky;top:0;z-index:2;padding:4px 2px;}
table.grid th .q{font-size:9px;color:${I.muted};height:11px;letter-spacing:.08em;text-transform:uppercase;}
table.grid .sticky{position:sticky;left:0;z-index:3;background:${I.panel};text-align:left;padding:4px 10px;min-width:230px;border-right:1px solid ${I.border};}
table.grid th.sticky{background:${I.raise};z-index:4;}
table.grid td.now,table.grid th.now{background:rgba(110,98,245,.10);}
table.grid td.past,table.grid th.past{background:rgba(255,255,255,.015);}
table.grid tr.dep{cursor:pointer;}
table.grid tr.dep:hover td{background:rgba(110,98,245,.06);}
table.grid tr.dep:focus-visible{outline:2px solid ${I.indigoSoft};}
table.grid tr.proposed .sticky{border-left:3px solid ${I.warn};}
.cust{font-weight:600;color:${I.text};display:flex;gap:6px;align-items:center;}
.rev{font:600 9px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:${I.warn};border:1px solid ${I.warn};border-radius:4px;padding:1px 5px;}
.site{margin-top:3px;display:flex;gap:6px;align-items:center;font-size:11px;}
.pill{display:inline-flex;gap:4px;align-items:center;padding:3px 7px;border-radius:6px;border:1.5px solid ${I.indigo};font:700 12px 'JetBrains Mono',monospace;background:${I.inset};}
.pill.st-po{background:${I.indigo};}
.pill.st-po span{color:#fff !important;}
.pill.st-contract{background:rgba(110,98,245,.22);}
.pill.st-soft,.pill.st-estimate{border-color:${I.sub};}
.qty{display:inline-flex;gap:4px;font-variant-numeric:tabular-nums;}
table.grid tr.sep td{background:${I.raise};font-size:11.5px;font-weight:600;height:28px;border-right:none;text-align:left;}
table.grid tr.num td{font-variant-numeric:tabular-nums;}
table.grid tr.num .sticky{font-weight:500;color:${I.sub};}
table.grid tr.end .sticky{font-weight:600;color:${I.text};}
table.grid tr.supply td{background:rgba(255,255,255,.02);}
.cellin{width:100%;height:32px;border:none;background:transparent;color:${I.text};text-align:center;font:600 12px 'JetBrains Mono',monospace;-moz-appearance:textfield;}
.cellin::-webkit-outer-spin-button,.cellin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.cellin:focus{outline:2px solid ${I.indigo};outline-offset:-2px;background:#141a28;}
.cellin.over{color:${I.red};}
table.grid td.changed{background:rgba(251,191,36,.12);}
.past-build{font:600 12px 'JetBrains Mono',monospace;color:${I.sub};}
.past-build.miss{color:${I.warn};}
.past-build small{font-size:9px;color:${I.muted};}
.dem{color:${I.sub};font:600 11.5px 'JetBrains Mono',monospace;}
.bal{display:inline-block;min-width:34px;padding:3px 6px;border-radius:5px;font:700 12px 'JetBrains Mono',monospace;}
.bal.ok{color:${I.text};}
.bal.buf{color:${I.warn};background:rgba(251,191,36,.10);}
.bal.neg{color:#fff;background:#8B2F2F;}
.hint{font-size:11px;color:${I.muted};margin-top:8px;line-height:1.55;}
.rollup-wrap{overflow-x:auto;margin-top:14px;}
table.rollup,table.pva,table.gaps{border-collapse:collapse;font-size:12px;width:100%;}
table.rollup th,table.pva th,table.gaps th{font:600 10px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:${I.muted};text-align:left;padding:5px 8px;border-bottom:1px solid ${I.border};}
table.rollup td,table.pva td,table.gaps td{padding:6px 8px;border-bottom:1px solid ${I.borderSoft};color:${I.sub};}
table.rollup th{text-align:center;}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:${I.text};}
td.n.neg{color:${I.red};}
table.gaps td.cust{color:${I.text};font-weight:600;}
.signals{display:grid;gap:10px;margin-top:12px;}
.signal{display:flex;gap:10px;font-size:12.5px;line-height:1.55;color:${I.sub};background:${I.inset};border:1px solid ${I.borderSoft};border-left:3px solid ${I.indigo};padding:11px 13px;border-radius:8px;}
.signal.red{border-left-color:${I.red};}
.signal.amber{border-left-color:${I.warn};}
.signal.ok{border-left-color:${I.green};}
.signal.acked{opacity:.7;}
.sig-body{flex:1;min-width:0;}
.sig-title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px;}
.sig-title b{color:${I.text};}
.owner{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:${I.indigoSoft};border:1px solid ${I.border};border-radius:4px;padding:1px 6px;}
.sig-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.queue-item{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border:1px solid ${I.borderSoft};border-radius:6px;background:${I.panel};}
.small-note{font-size:11px;margin-top:6px;}
.plan-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;margin-top:12px;font-size:12.5px;}
.plan-meta .k{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:${I.muted};margin-bottom:3px;}
.plan-meta .consensus{grid-column:1 / -1;}
.plan-meta .consensus input{width:100%;}
.oc{color:${I.warn};font-weight:600;}
.onc{color:${I.green};font-weight:600;}
.draft{margin-top:14px;padding:14px;border:1px dashed ${I.warn};border-radius:10px;background:rgba(251,191,36,.05);}
.draft-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
.delta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.delta-item{font:500 11.5px 'JetBrains Mono',monospace;padding:3px 7px;border-radius:5px;background:${I.inset};border:1px solid ${I.borderSoft};color:${I.sub};}
.delta-item b{color:${I.text};}
.ramif{font-size:12px;color:${I.sub};margin-top:8px;line-height:1.7;}
.ramif span{margin-right:10px;}
.checklist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:5px;}
.checklist li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;font-size:12px;align-items:baseline;}
.checklist li.ok .tick{color:${I.green};font-weight:700;}
.checklist li.no .tick{color:${I.red};font-weight:700;}
.checklist li.no{color:${I.text};}
.ramp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border:1px solid ${I.borderSoft};border-radius:8px;background:${I.inset};font-size:12px;color:${I.sub};}
.ramp-k{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:${I.muted};margin-right:4px;}
.ramp label{display:flex;gap:6px;align-items:center;}
.ramp input{width:56px;font:600 12px 'JetBrains Mono',monospace;padding:6px 8px;border:1px solid ${I.border};border-radius:6px;background:${I.panel};color:${I.text};text-align:center;}
.ramp select{padding:6px 8px;font-size:12px;}
.versions{list-style:none;margin:0;padding:0;font-size:12px;color:${I.sub};display:grid;gap:5px;}
.versions b{color:${I.green};}
table.pva tr.total td{border-top:1px solid ${I.border};font-weight:700;color:${I.text};}
table.grid tr.rejected{opacity:.45;}
table.grid tr.rejected .cust{text-decoration:line-through;}
.rev.rej{color:${I.red};border-color:${I.red};text-decoration:none;}
.ledger{list-style:none;margin:0;padding:0;font-size:12px;color:${I.sub};display:grid;gap:5px;}
.ledger b{color:${I.text};}
.empty{font-size:12px;color:${I.muted};padding:10px 4px;line-height:1.5;}
.rm{border:none;background:none;color:${I.red};font-weight:700;cursor:pointer;font-size:14px;line-height:1;}
.assump{margin-top:12px;}
.assump-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
.assump-card{background:${I.inset};border:1px solid ${I.borderSoft};border-radius:8px;padding:12px;}
.assump-card h4{margin:0 0 8px;}
.assump-card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:${I.sub};padding:4px 0;}
.assump-card .row input{width:110px;font:600 12px 'JetBrains Mono',monospace;padding:5px 8px;border:1px solid ${I.border};border-radius:6px;background:${I.panel};color:${I.text};text-align:right;}
.foot{margin-top:24px;font-size:11.5px;color:${I.muted};line-height:1.65;max-width:100ch;}
.foot b{color:${I.sub};}
.modal-bg{position:fixed;inset:0;background:rgba(5,7,12,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:${I.panel};border:1px solid ${I.border};border-radius:12px;padding:20px;width:min(560px,100%);max-height:92vh;overflow:auto;}
.modal h3{margin:0 0 12px;font-size:15px;}
.form{display:grid;gap:10px;}
.form label{display:grid;gap:4px;font-size:11.5px;font-weight:600;color:${I.sub};}
.form input,.form select{font:500 13px 'Inter';padding:8px 10px;border:1px solid ${I.border};border-radius:8px;background:${I.inset};color:${I.text};}
