@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
.sdp *{box-sizing:border-box;}
.sdp{min-height:100vh;background:${j.canvas};color:${j.text};font-family:'Inter',system-ui,sans-serif;padding:0 0 48px;font-size:13px;}
.sdp .mono{font-family:'JetBrains Mono',monospace;}
.sdp .dim{color:${j.muted};font-weight:400;}
.sdp .hot-text{color:${j.red};}
.head{padding:16px 28px;display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:space-between;border-bottom:1px solid ${j.border};}
.brand{font-weight:600;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:${j.sub};}
.title{font-size:17px;font-weight:700;margin-top:3px;letter-spacing:-.01em;}
.title .dim{font-size:12.5px;font-weight:500;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;background:${j.panel};border:1px solid ${j.border};color:${j.sub};}
.chip b{color:${j.text};font-weight:600;}
.chip.ok{border-color:#1E4636;color:#7EDDB4;background:#0E1E18;}
.chip.hot{border-color:#4A2626;color:#F5A19B;background:#1E1112;}
.seg.lens button{font-size:11px;padding:6px 9px;}
.card.role{border-color:${j.indigo};background:#12142A;}
.role-points{margin:10px 0 0;padding-left:20px;font-size:12.5px;color:${j.sub};line-height:1.6;display:grid;gap:4px;}
.role-points li::marker{color:${j.indigoSoft};font-weight:700;}
.who{font:500 12px 'Inter';padding:7px 10px;border:1px solid ${j.border};border-radius:8px;background:${j.inset};color:${j.text};width:190px;}
.who::placeholder{color:${j.muted};}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px;}
.kpi{background:${j.panel};border:1px solid ${j.border};border-radius:10px;padding:10px 14px;display:grid;gap:4px;}
.kpi.bad{border-color:#4A2626;}
.kpi-name{font:600 10.5px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px;}
.kpi-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:${j.sub};}
.kpi-row b{color:${j.text};font-variant-numeric:tabular-nums;font-weight:700;}
.kpi-row b small{color:${j.warn};margin-left:2px;}
.slots{display:flex;flex-direction:column;gap:5px;padding-bottom:6px;}
.slots-k{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:${j.muted};}
.slot{display:flex;gap:6px;align-items:baseline;font:700 12px 'Inter';padding:5px 9px;border-radius:7px;border:1px solid ${j.border};background:${j.inset};color:${j.sub};cursor:pointer;}
.slot small{font:500 10px 'JetBrains Mono',monospace;color:${j.muted};}
.slot.on{border-color:${j.indigo};color:${j.text};background:rgba(110,98,245,.14);}
.seg{display:inline-flex;border:1px solid ${j.border};border-radius:8px;overflow:hidden;background:${j.inset};padding:2px;gap:2px;}
.seg button{font:500 11.5px 'Inter';padding:6px 10px;border:none;background:transparent;cursor:pointer;color:${j.sub};border-radius:6px;}
.seg button.on{background:${j.indigo};color:#fff;font-weight:600;}
.miles{display:flex;gap:0;margin-top:14px;overflow-x:auto;padding:12px 0 4px;border-top:1px dashed ${j.borderSoft};}
.mile{flex:1;min-width:130px;position:relative;padding:0 10px 0 0;}
.mile::before{content:"";position:absolute;top:6px;left:14px;right:0;height:1.5px;background:${j.border};}
.mile:last-child::before{display:none;}
.mile-dot{width:13px;height:13px;border-radius:50%;background:${j.canvas};border:3px solid ${j.indigo};position:relative;z-index:1;}
.mile.due .mile-dot{background:${j.warn};border-color:${j.warn};}
.mile-wk{font:600 12px 'JetBrains Mono',monospace;margin-top:8px;color:${j.text};}
.mile-label{font-size:11px;font-weight:600;color:${j.sub};line-height:1.35;margin-top:2px;}
.mile-owner{font-size:10.5px;color:${j.muted};margin-top:2px;}
.draft-dot{color:${j.warn};font-weight:600;}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px;}
.cadence{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap;align-items:stretch;}
.cad{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid ${j.borderSoft};border-radius:8px;background:${j.panel};}
.cad.now{border-color:${j.indigo};background:#161634;}
.cad-k{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:${j.muted};}
.cad.now .cad-k{color:${j.indigoSoft};}
.cad-t{font-weight:600;font-size:12.5px;}
.cad-w{font-size:11px;color:${j.muted};}
.cad-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.card{background:${j.panel};border:1px solid ${j.border};border-radius:12px;padding:18px 20px;margin-top:16px;}
.card h2{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;}
.card h3{font-weight:700;font-size:14px;margin:0 0 8px;}
.card h4{font-weight:700;font-size:12px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.1em;color:${j.sub};}
.card .sub{font-size:12px;color:${j.muted};margin:4px 0 0;line-height:1.5;max-width:70ch;}
.card-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;}
.head-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:1000px){.two{grid-template-columns:1fr;}}
.mode{display:inline-flex;background:${j.inset};border:1px solid ${j.border};border-radius:10px;overflow:hidden;padding:3px;gap:3px;}
.mode button{font:500 12.5px 'Inter';padding:7px 14px;border:none;background:transparent;color:${j.sub};cursor:pointer;border-radius:7px;}
.mode button.on{background:${j.indigo};color:#fff;font-weight:600;}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center;margin-top:16px;}
@media(max-width:980px){.hero{grid-template-columns:1fr;}}
.inputs{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;}
.ask-side{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;}
.stepper label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:6px;}
.stepper-row{display:flex;align-items:stretch;border:1.5px solid var(--acc);border-radius:10px;overflow:hidden;background:${j.inset};}
.stepper-row button{width:40px;font:600 20px 'Inter';border:none;background:${j.panel};color:${j.sub};cursor:pointer;}
.stepper-row button:hover{background:var(--acc);color:#0A0D13;}
.stepper-row input{width:80px;border:none;text-align:center;font:700 34px 'Inter';color:${j.text};background:${j.inset};padding:4px 0;-moz-appearance:textfield;}
.stepper-row input::-webkit-outer-spin-button,.stepper-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.stepper-row input:focus{outline:none;background:#141a28;}
.tray-col{display:flex;flex-direction:column;gap:8px;}
.type-seg{display:flex;border:1px solid ${j.border};border-radius:8px;overflow:hidden;background:${j.inset};padding:2px;gap:2px;}
.type-seg button{flex:1;font:600 11px 'Inter';letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border:none;background:transparent;cursor:pointer;color:${j.muted};border-radius:6px;}
.type-seg button.h.on{background:#0E2334;color:${j.sky};}
.type-seg button.l.on{background:#2A1230;color:${j.pink};}
.link-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:${j.sub};font-weight:500;cursor:pointer;user-select:none;}
.link-toggle input{accent-color:${j.indigo};width:15px;height:15px;}
.sdp select,.sdp input.text,.sdp .hold-name,.sdp .consensus input{font:500 13px 'Inter';padding:8px 10px;border:1px solid ${j.border};border-radius:8px;background:${j.inset};color:${j.text};}
.sdp select:focus,.sdp input:focus{outline:2px solid ${j.indigo};outline-offset:0;}
label.small{display:block;font-size:11.5px;font-weight:600;color:${j.sub};margin:10px 0 4px;}
.tag{position:relative;border:1px dashed ${j.border};border-radius:12px;padding:16px 20px 16px 48px;background:${j.inset};display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center;}
.tag::before{content:"";position:absolute;left:18px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:${j.canvas};border:2px solid ${j.border};}
.tag.green{border-color:#2A6A4E;background:#0D1F17;}.tag.green::before{border-color:${j.green};}
.tag.tight{border-color:#6B5320;background:#1D1810;}.tag.tight::before{border-color:${j.warn};}
.tag.later,.tag.none{border-color:#6B3030;background:#1F1213;}.tag.later::before,.tag.none::before{border-color:${j.red};}
.verdict{font-weight:700;font-size:18px;letter-spacing:-.01em;line-height:1.1;}
.tag.green .verdict{color:${j.green}}.tag.tight .verdict{color:${j.warn}}.tag.later .verdict,.tag.none .verdict{color:${j.red}}.tag.idle .verdict{color:${j.muted}}
.stamp{font-weight:800;font-size:26px;line-height:1;letter-spacing:-.01em;}
.stamp small{display:block;font:600 10px 'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:${j.muted};margin-bottom:4px;}
.tag-detail{font-size:12px;color:${j.sub};max-width:420px;line-height:1.5;}
.gap-note{color:${j.warn};font-weight:600;}
.tag-actions{display:flex;gap:8px;flex-basis:100%;margin-top:8px;flex-wrap:wrap;align-items:center;}
.btn{font:600 12px 'Inter';padding:8px 14px;border-radius:8px;border:1px solid ${j.indigo};background:${j.indigo};color:#fff;cursor:pointer;}
.btn.ghost{background:transparent;color:${j.indigoSoft};}
.btn.warn{background:transparent;border-color:${j.warn};color:${j.warn};}
.btn.danger{background:transparent;border-color:#6B3030;color:${j.red};}
.btn:hover:not(:disabled){filter:brightness(1.15);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:focus-visible,.mini:focus-visible{outline:2px solid ${j.text};}
.mini{font:600 11px 'Inter';padding:4px 9px;border-radius:6px;border:1px solid ${j.border};background:${j.raise};color:${j.text};cursor:pointer;}
.mini.danger{color:${j.red};border-color:#4A2626;}
.hold-name{width:190px;}
.hold-name::placeholder{color:${j.muted};}
.heat-scroll{overflow-x:auto;padding-bottom:4px;margin-top:16px;}
.heat{display:flex;gap:3px;min-width:900px;}
.cell{flex:1;border-radius:6px;padding:7px 2px 6px;text-align:center;cursor:default;border:1px solid transparent;}
.cell .k{font:700 16px 'Inter';line-height:1;}
.cell .d{font:500 8.5px 'JetBrains Mono',monospace;opacity:.8;margin-top:4px;letter-spacing:.02em;}
.cell.past{background:transparent;color:${j.muted};border-color:${j.borderSoft};opacity:.6;}
.cell.g0{background:#12161F;color:#525C72;border-color:${j.borderSoft};}
.cell.g1{background:#251A0C;color:#C98A2B;}
.cell.g2{background:#33230C;color:${j.amber};}
.cell.g3{background:#0E241C;color:#4EC393;}
.cell.g4{background:#0F3226;color:#6EE7B7;}
.cell.gated{outline:1.5px dashed #6B5320;outline-offset:-2px;}
.cell.now{box-shadow:inset 0 0 0 1.5px ${j.indigoSoft};}
.cell.cond{border-bottom:2px dashed ${j.red};}
.heat-legend{display:flex;gap:14px;font-size:11px;color:${j.muted};margin-top:8px;flex-wrap:wrap;}
.lg{display:flex;align-items:center;gap:5px;font-size:11.5px;}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:${j.sub};}
.stage-chip{font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1.5px solid ${j.indigo};color:${j.indigoSoft};white-space:nowrap;}
.st-po{background:${j.indigo};color:#fff;border-style:solid;}
.st-contract{background:rgba(110,98,245,.28);border-style:solid;}
.st-negotiation{background:transparent;border-style:dashed;}
